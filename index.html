<style>
:root{--bg:#13080d;--bg2:#1a0a12;--pnl:rgba(36,20,25,.85);--bd:#3d2230;--tx:#f0e6ea;--dm:#a88b96;--ac:#e56b9b;--ac2:#8b3a62;--ok:#5ad67d;--bad:#e56b6b;--wr:#ffd76a;--fs:14px;--skin:#f0d0d8;--hair:#3a2028;--cloth:#8a6a9a;--cloth2:#5a4a5a}
[data-theme=night]{--bg:#0a0f1a;--bg2:#0d1424;--pnl:rgba(20,28,46,.85);--bd:#2a3d5c;--tx:#dce8f5;--dm:#7a8ba8;--ac:#6ba8e5;--ac2:#3a5a8b;--hair:#1a1018;--cloth:#3a5a8b;--cloth2:#2a3d5c}
[data-theme=dawn]{--bg:#faf0e8;--bg2:#f5e5d8;--pnl:rgba(255,255,255,.85);--bd:#e0c8b8;--tx:#3a2820;--dm:#8a7060;--ac:#d4647a;--ac2:#a04058;--hair:#5a4030;--cloth:#d4647a;--cloth2:#c9a87c}
[data-theme=witch]{--bg:#0f0a1a;--bg2:#150a20;--pnl:rgba(30,20,46,.85);--bd:#4a2d6a;--tx:#e8d8f5;--dm:#9a82b8;--ac:#a86be5;--ac2:#5a3a8b;--hair:#2a1830;--cloth:#a86be5;--cloth2:#5a3a8b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:radial-gradient(circle at 50% 0,var(--bg2),var(--bg) 70%);color:var(--tx);font-family:-apple-system,sans-serif;padding:10px;min-height:100vh;font-size:var(--fs);overflow-x:hidden}
body[data-ar=high]{background:radial-gradient(circle at 50% 0,var(--ac2),var(--bg) 70%)}
body[data-ar=max]{background:radial-gradient(circle at 50% 0,var(--ac),var(--bg) 70%);animation:br 2.5s infinite}
@keyframes br{0%,100%{filter:brightness(1)}50%{filter:brightness(1.15)}}
.wrap{max-width:540px;margin:0 auto}
.ab{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;padding:8px 12px;border-radius:10px;text-align:center;font-size:.82rem;margin-bottom:6px;cursor:pointer}
.ab.hide{display:none}
.tb{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:6px}
h1{color:var(--ac);font-size:.9rem;letter-spacing:.2em;margin:0;font-weight:600;text-align:center;flex:1}
.ib{background:transparent;border:1px solid var(--bd);color:var(--tx);width:36px;height:36px;border-radius:9px;font-size:1rem;padding:0;cursor:pointer;flex-shrink:0}
.ib.on{border-color:var(--ac)}
.av{position:relative;width:100%;height:200px;background:var(--pnl);border:1px solid var(--bd);border-radius:14px;margin-bottom:6px;overflow:hidden}
.av svg{width:100%;height:100%;display:block}
.av .md{position:absolute;bottom:6px;right:10px;font-size:.72rem;color:var(--dm);background:rgba(0,0,0,.35);padding:3px 9px;border-radius:10px;z-index:2}
.av .wi{position:absolute;top:8px;right:10px;font-size:1.1rem;z-index:2}
.av .li{position:absolute;top:8px;left:10px;font-size:.75rem;color:var(--dm);background:rgba(0,0,0,.35);padding:3px 9px;border-radius:10px;z-index:2}
.cd{background:var(--pnl);border:1px solid var(--bd);border-radius:11px;padding:9px;margin:5px 0;font-size:.82rem}
.rw{display:flex;justify-content:space-between;padding:2px 0;gap:8px}
.rw b{font-weight:500;text-align:right}
.br{height:8px;background:rgba(0,0,0,.4);border-radius:5px;overflow:hidden;margin:4px 0}
.br>div{height:100%;transition:width .5s}
.hp>div{background:linear-gradient(90deg,#6a1010,#e56b6b)}
.st>div{background:linear-gradient(90deg,#205080,#6b9ee5)}
.ar>div{background:linear-gradient(90deg,var(--ac2),var(--ac))}
.lg{min-height:120px;max-height:34vh;overflow-y:auto;line-height:1.55}
.lg p{margin:0 0 6px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.cr{color:var(--wr);font-weight:600}
.hn{color:var(--dm);font-style:italic}.ai{color:#c98aff}.lo{color:var(--ac)}.me{color:#8ec8e5}
.cd2{color:#7ac8ff;font-family:monospace;font-size:.8rem;white-space:pre-wrap}.lc{color:var(--ac2)}
button{width:100%;padding:11px;margin:4px 0;font:inherit;font-size:.86rem;color:var(--tx);background:rgba(51,32,42,.6);border:1px solid var(--bd);border-radius:10px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:8px}
button:active{background:var(--ac2);color:#fff}
button .ic{font-size:1rem;flex-shrink:0}
.ai-btn{background:rgba(61,31,74,.7);border-color:#8b3a62}
.ch-btn{background:rgba(58,42,16,.7);border-color:#8a6a30}
.sc-btn{background:rgba(16,58,42,.7);border-color:#308a6a}
.lo-btn{background:rgba(74,31,48,.7);border-color:#a83a62}
.ky-btn{background:rgba(31,58,74,.7);border-color:#3a6a8a}
.dg-btn{background:rgba(58,16,16,.7);border-color:#8a3030}
.gl-btn{background:rgba(74,58,16,.7);border-color:#c9a87c}
.st-btn{background:rgba(74,31,90,.7);border-color:#8b3a9a}
.dm{color:var(--dm)}.sm{font-size:.7rem}
textarea{width:100%;padding:10px;background:rgba(0,0,0,.3);color:var(--tx);border:1px solid var(--bd);border-radius:8px;font:inherit;font-size:.88rem;margin:5px 0;min-height:65px}
.ts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ac2);color:#fff;padding:9px 16px;border-radius:20px;font-size:.82rem;opacity:0;transition:.3s;pointer-events:none;z-index:100}
.ts.sh{opacity:1}
.mo{position:fixed;top:22%;left:50%;transform:translate(-50%,-50%);font-size:2.4rem;font-weight:700;color:var(--ac);opacity:0;pointer-events:none;z-index:200;text-align:center}
.mo.sh{animation:mop 1.5s ease-out forwards}
.mo .sb{font-size:.82rem;color:var(--tx);display:block;margin-top:8px}
@keyframes mop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}60%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-170%) scale(.9)}}
.sr{display:flex;justify-content:space-between;align-items:center;padding:9px 11px;background:rgba(0,0,0,.2);border:1px solid var(--bd);border-radius:9px;margin:5px 0;gap:10px}
.sr .lbl{font-size:.83rem;flex:1}
.sr .vl{font-size:.72rem;color:var(--dm);margin-right:6px}
.sg{display:flex;gap:4px}
.sg button{margin:0;padding:7px 10px;width:auto;justify-content:center;font-size:.75rem}
.sg button.on{background:var(--ac);color:#fff}
input[type=range]{width:120px;accent-color:var(--ac)}
.tg{position:relative;width:46px;height:24px;background:rgba(0,0,0,.4);border:1px solid var(--bd);border-radius:13px;cursor:pointer;transition:.2s}
.tg.on{background:var(--ac)}
.tg::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.2s}
.tg.on::after{left:24px}
.th-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:5px 0}
.th-row button{margin:0;padding:9px 4px;text-align:center;justify-content:center;font-size:1.3rem;flex-direction:column;gap:2px}
.th-row button.on{border-color:var(--ac)}
.ver{text-align:center;color:var(--ac);font-size:.9rem;margin:24px 0 12px;letter-spacing:.12em;font-weight:700;padding:12px;background:var(--pnl);border:2px solid var(--ac);border-radius:12px}
.ver small{display:block;color:var(--dm);font-size:.7rem;font-weight:400;margin-top:4px}
/* SVG анимации */
.fc-soft{animation:fcsoft 4s ease-in-out infinite}
@keyframes fcsoft{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.hb{animation:hb 1.2s ease-in-out infinite}
@keyframes hb{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.15);opacity:1}}
.shk{animation:shk .15s infinite}
@keyframes shk{0%,100%{transform:translateX(0)}50%{transform:translateX(1px)}}

<script>
// ══════════════════════════════════════════
//  КОНФИГ
// ══════════════════════════════════════════
var CFG = {theme:'rose',masterVol:.7,fontSize:14,vib:true,volMoan:1,volSigh:1,volRip:1,volHit:1,volFind:1,volFail:1};
try { var sv = localStorage.getItem('lc15'); if (sv) Object.assign(CFG, JSON.parse(sv)); } catch(e) {}
function sCfg() { try { localStorage.setItem('lc15', JSON.stringify(CFG)); } catch(e) {} }
function applyCfg() {
  document.body.dataset.theme = CFG.theme;
  document.documentElement.style.setProperty('--fs', CFG.fontSize + 'px');
  sCfg();
}

// ══════════════════════════════════════════
//  АУДИО (компактно)
// ══════════════════════════════════════════
var snd = false, ac = null;
function getAC() { if (ac) return ac; try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ ac=null; } return ac; }
function unlock() {
  var c = getAC(); if (!c) return Promise.resolve(false);
  var p = (c.state === 'suspended') ? c.resume() : Promise.resolve();
  return p.then(function() {
    try { var b=c.createBuffer(1,1,22050); var s=c.createBufferSource(); s.buffer=b; s.connect(c.destination); s.start(0); } catch(e){}
    return c.state === 'running';
  });
}
document.getElementById('ab').addEventListener('touchstart', function(e){
  e.stopPropagation();
  unlock().then(function(ok){
    if(!ok) return;
    snd=true;
    var b=document.getElementById('sb'); b.textContent='🔊'; b.classList.add('on');
    document.getElementById('ab').classList.add('hide');
    toast('Звук включён'); tstSnd();
  });
});
function togSnd(){
  var b=document.getElementById('sb');
  if(!snd){
    unlock().then(function(ok){
      if(!ok) return;
      snd=true; b.textContent='🔊'; b.classList.add('on');
      document.getElementById('ab').classList.add('hide');
      toast('Звук включён'); tstSnd();
    });
  } else {
    snd=false; b.textContent='🔇'; b.classList.remove('on');
    toast('Звук выключен');
  }
}
function tstSnd(){ beep(660,.1,.08); setTimeout(function(){beep(880,.14,.08);},120); }
function beep(f,d,v){ if(!snd||!ac||ac.state!=='running')return; try{ var n=ac.currentTime,o=ac.createOscillator(),g=ac.createGain(); o.frequency.value=f; o.type='sine'; g.gain.setValueAtTime(.0001,n); g.gain.linearRampToValueAtTime(v*CFG.masterVol,n+.008); g.gain.exponentialRampToValueAtTime(.0001,n+d); o.connect(g); g.connect(ac.destination); o.start(n); o.stop(n+d+.02);}catch(e){} }

function moanSnd(lv){
  if(!snd||!ac||ac.state!=='running')return;
  var vol=CFG.masterVol*CFG.volMoan; if(vol<=0)return;
  try{
    var c=ac,n=c.currentTime;
    var f0=(lv==='max')?430:(lv==='heavy')?380:340;
    var f1=(lv==='max')?560:(lv==='heavy')?470:400;
    var dur=(lv==='max')?1.5:(lv==='heavy')?1.1:.7;
    var o=c.createOscillator(); o.type='sawtooth';
    o.frequency.setValueAtTime(f0,n);
    o.frequency.linearRampToValueAtTime(f1,n+dur*.75);
    var m=c.createGain();
    m.gain.setValueAtTime(.0001,n);
    m.gain.linearRampToValueAtTime(.12*vol,n+.12);
    m.gain.setValueAtTime(.12*vol,n+dur*.45);
    m.gain.exponentialRampToValueAtTime(.0001,n+dur);
    [850,1220,2810].forEach(function(fq){
      var bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=fq; bp.Q.value=12;
      o.connect(bp); bp.connect(m);
    });
    m.connect(c.destination);
    o.start(n); o.stop(n+dur+.2);
  }catch(e){}
}
function rip(lv){
  if(!snd||!ac||ac.state!=='running')return;
  var vol=CFG.masterVol*CFG.volRip; if(vol<=0)return;
  try{
    var c=ac,n=c.currentTime;
    var cnt=(lv==='max')?8:(lv==='heavy')?5:3;
    for(var i=0;i<cnt;i++){
      var t=n+i*.04;
      var buf=c.createBuffer(1,2048,c.sampleRate);
      var d=buf.getChannelData(0);
      for(var j=0;j<2048;j++) d[j]=(Math.random()*2-1)*(1-j/2048);
      var s=c.createBufferSource(); s.buffer=buf;
      var hp=c.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=1200;
      var g=c.createGain();
      g.gain.setValueAtTime(.0001,t);
      g.gain.linearRampToValueAtTime(.1*vol,t+.005);
      g.gain.exponentialRampToValueAtTime(.0001,t+.1);
      s.connect(hp); hp.connect(g); g.connect(c.destination);
      s.start(t); s.stop(t+.12);
    }
  }catch(e){}
}
function hit(){
  if(!snd||!ac||ac.state!=='running')return;
  var vol=CFG.masterVol*CFG.volHit; if(vol<=0)return;
  try{
    var c=ac,n=c.currentTime;
    var o=c.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(140,n);
    o.frequency.exponentialRampToValueAtTime(40,n+.15);
    var g=c.createGain();
    g.gain.setValueAtTime(.0001,n);
    g.gain.linearRampToValueAtTime(.22*vol,n+.005);
    g.gain.exponentialRampToValueAtTime(.001,n+.28);
    o.connect(g); g.connect(c.destination);
    o.start(n); o.stop(n+.32);
  }catch(e){}
}
function fnd(){
  if(!snd||!ac||ac.state!=='running')return;
  var vol=CFG.masterVol*CFG.volFind; if(vol<=0)return;
  var c=ac,n=c.currentTime;
  [784,988,1175,1568].forEach(function(f,i){
    var t=n+i*.06;
    var o=c.createOscillator(); o.type='triangle'; o.frequency.value=f;
    var g=c.createGain();
    g.gain.setValueAtTime(.0001,t);
    g.gain.linearRampToValueAtTime(.07*vol,t+.01);
    g.gain.exponentialRampToValueAtTime(.0001,t+.35);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t+.4);
  });
}
function fai(){
  if(!snd||!ac||ac.state!=='running')return;
  var vol=CFG.masterVol*CFG.volFail; if(vol<=0)return;
  try{
    var c=ac,n=c.currentTime;
    var o=c.createOscillator(); o.type='triangle';
    o.frequency.setValueAtTime(220,n);
    o.frequency.exponentialRampToValueAtTime(70,n+.5);
    var g=c.createGain();
    g.gain.setValueAtTime(.0001,n);
    g.gain.linearRampToValueAtTime(.14*vol,n+.02);
    g.gain.exponentialRampToValueAtTime(.001,n+.55);
    o.connect(g); g.connect(c.destination);
    o.start(n); o.stop(n+.6);
  }catch(e){}
}

// ══════════════════════════════════════════
//  СТОНЫ
// ══════════════════════════════════════════
var MT = {
  light:['Ах...','Ммм...','Ох...','Ай...','Н-н-н...'],
  heavy:['Ааах!..','Ммаа~','Ооох!..','Ня~','Ммм~!'],
  max:['ААААХ!~','МММАА~!!','ОООХ~!','Аааа~!!']
};
var MH = {
  torn:'— одежда порвана...', bugs:'— что-то ползёт по коже!',
  relieve:'— она уединилась...', ecstasy:'— потеряла контроль!',
  strip:'— срывает одежду...', sensitive:'— что-то чувствительное...',
  beast:'— зверь рядом...', wound:'— её ранили...'
};
function moan(level, ctx){
  var e=document.getElementById('mo'); if(!e) return;
  var txt=pk(MT[level]||MT.light);
  var hint=MH[ctx]||'';
  e.innerHTML=txt+(hint?'<span class="sb">'+hint+'</span>':'');
  e.classList.remove('sh'); void e.offsetWidth; e.classList.add('sh');
  moanSnd(level);
  if(CFG.vib&&navigator.vibrate) try{navigator.vibrate(40);}catch(e){}
}

// ══════════════════════════════════════════
function $(id){ return document.getElementById(id); }
function cl(v,a,b){ return Math.max(a,Math.min(b,v)); }
function rnd(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function ch(p){ return Math.random()<p; }
function pk(a){ return a[Math.floor(Math.random()*a.length)]; }
function d10(){ return Math.floor(Math.random()*10)+1; }
function out(v){ if(v<=3)return'cf'; if(v<=5)return'f'; if(v===10)return'cr'; return'ok'; }
function lg(t,c){ var p=document.createElement('p'); if(c)p.className=c; p.textContent=t; var L=$('lg'); L.appendChild(p); L.scrollTop=1e9; }
function clLg(){ $('lg').innerHTML=''; }
function toast(m){ var t=$('ts'); t.textContent=m; t.classList.add('sh'); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('sh');},1500); }

// ══════════════════════════════════════════
//  ДАННЫЕ
// ══════════════════════════════════════════
var SETS = {
  'Обычный': { top:['Майка',1,['breasts']], bra:['Лифчик',1,['breasts']], bottom:['Шорты',0,['butt','pussy']], panties:['Трусики',1,['butt','pussy']] },
  'Уличный': { top:['Топ',1,['breasts']], bra:['Лифчик',1,['breasts']], bottom:['Юбка',0,['butt']], panties:['Трусики',1,['butt','pussy']] },
  'Спортивный': { outer:['Худи',0,['breasts']], bottom:['Обтяг. шорты',1,['butt','pussy']], panties:['Спорт. трусики',1,['butt','pussy']] },
  'Купальник': { swim_top:['Верх куп.',1,['breasts']], swim_bottom:['Плавки',1,['butt','pussy']] }
};
var SL = { outer:'Верх',top:'Верх',bra:'Лифчик',bottom:'Низ',panties:'Трусики',swim_top:'Куп.верх',swim_bottom:'Куп.низ' };
var DUR = {3:'✅',2:'⚠️',1:'❌',0:'🔴'};
var SG = {
  '[попка]':['попка','жопка','попа'], '[сиськи]':['сиськи','сиси','грудь'],
  '[киска]':['киска','писька','вагина'], '[лифчик]':['лифчик','бюстгальтер']
};

// ЛОКАЦИИ — расширено
var LOC = {
  forest:{ n:'🌲 Тёмный лес', d:'Вековые ели, птицы молчат.', to:['swamp','ruins','clearing','cave'], ev:['beast','bugs','scrap','berry','stranger','mushroom','wound_traveler'] },
  swamp:{ n:'🌿 Гнилое болото', d:'Пахнет тиной и гнилью.', to:['forest','ruins','witch'], ev:['bugs2','sink','fog','wisp','scrap','altar'] },
  ruins:{ n:'🏚 Старые руины', d:'Разрушенная стена, обломки.', to:['forest','swamp','village','graveyard'], ev:['ghost','chest','beast','trap','mushroom','skeleton'] },
  clearing:{ n:'🌼 Поляна', d:'Солнечный свет, мягкая трава.', to:['forest','village'], ev:['flower','rest','butterfly','berry','scrap','merchant'] },
  village:{ n:'🏘 Заброшенная деревня', d:'Пустые дома, скрипящие двери.', to:['ruins','clearing','river'], ev:['stranger','chest','ghost','scrap','mushroom','merchant'] },
  river:{ n:'🌊 Река', d:'Быстрая холодная вода.', to:['village','forest'], ev:['swim','scrap','beast','fish','berry'] },
  cave:{ n:'🕳 Тёмная пещера', d:'Здесь пахнет сыростью и мхом.', to:['forest','graveyard'], ev:['goblin','chest','trap','bugs2','ghost','mushroom'] },

var KEY=''; try{ KEY=localStorage.getItem('lk15')||''; }catch(e){}
function saveK(k){ KEY=k.trim(); try{localStorage.setItem('lk15',KEY);}catch(e){} }
var MODELS=['google/gemma-3-27b-it:free','meta-llama/llama-3.3-70b-instruct:free','qwen/qwen3-next-80b-a3b-instruct:free','openai/gpt-oss-120b:free','mistralai/mistral-small-3.1-24b-instruct:free'];
var CUR=null, FL={};

function callModel(m,msgs){
  return fetch('https://openrouter.ai/api/v1/chat/completions',{
    method:'POST',
    headers:{'Authorization':'Bearer '+KEY,'Content-Type':'application/json','HTTP-Referer':'https://lona.local','X-Title':'Lona'},
    body:JSON.stringify({model:m,messages:msgs})
  }).then(function(r){
    if(r.status===200){ return r.json().then(function(d){ return {ok:true,text:d.choices[0].message.content.trim()}; }); }
    return {ok:false,status:r.status};
  });
}
function aiCall(msgs){
  var ord=[]; if(CUR) ord.push(CUR);
  for(var i=0;i<MODELS.length;i++) if(MODELS[i]!==CUR) ord.push(MODELS[i]);
  var le='', idx=0;
  function next(){
    if(idx>=ord.length) return Promise.resolve('[ИИ недоступен. '+le+']');
    var m=ord[idx++]; FL[m]=FL[m]||0;
    if(FL[m]>=3 && m!==CUR) return next();
    return callModel(m,msgs).then(function(r){
      if(r.ok){ CUR=m; FL[m]=0; return r.text; }
      if([401,402,403,404].indexOf(r.status)!==-1) FL[m]=99; else FL[m]++;
      le=m.slice(0,20)+':'+r.status;
      return next();
    });
  }
  return next();
}
function stateTxt(){
  var w=[], slots=['outer','top','bra','bottom','panties','swim_top','swim_bottom'];
  for(var i=0;i<slots.length;i++){
    var sl=slots[i], it=S.ward[sl]; if(!it) continue;
    w.push(SL[sl]+'='+it.name+'('+['рвань','порвано','надорвано','целая'][it.dur]+')');
  }
  return 'HP '+S.hp+'/'+S.maxHp+', ст '+S.st+'/'+S.maxSt+', возб '+S.ar+'%, лок '+LOC[S.loc].n+
    ', погода '+S.weather+', '+S.time+', '+(S.muddy?'грязь':'чисто')+
    ', лоск '+S.scrap+' трав '+S.herbs+' зел '+S.potions+' еды '+S.food+' зол '+S.gold+
    ', '+(w.join(', ')||'без одежды')+', ход '+S.turn;
}
function askAI(msg,mode,useSt){
  if(!KEY) return Promise.resolve('[Ключ не введён.]');
  if(useSt===undefined) useSt=true;
  if(!mode) mode='game';
  var sys;
  if(mode==='code') sys='Ты опытный программист. Пиши рабочий код с комментариями.';
  else if(mode==='lona') sys='Ты — Лона, 19-летняя застенчивая девушка. Отвечай ОТ ПЕРВОГО ЛИЦА, смущённо, живо, коротко (1-3 предложения).';
  else sys='Ты — Гейм-Мастер тёмного фэнтези RPG. Пиши атмосферно, коротко (2-4 предложения).';
  var msgs=[{role:'system',content:sys}];
  if(useSt) msgs.push({role:'system',content:stateTxt()});
  if(mode==='lona' && S.chat.length){
    var tail=S.chat.slice(-8);
    for(var i=0;i<tail.length;i++) msgs.push(tail[i]);
  }
  msgs.push({role:'user',content:msg});
  return aiCall(msgs);
}

function act(k){
  if(S.over) return;
  clLg();

  if(S.pending){ scEc(); S.pending=0; S.turn++; endT(); return; }
  if(k==='ai'){ S.mode='ai'; clLg(); render(); return; }
  if(k==='travel'){ S.mode='travel'; clLg(); render(); return; }
  if(k==='inv'){ S.mode='inv'; clLg(); render(); return; }

  if(k==='explore') doExp();
  else if(k==='hunt') doHunt();
  else if(k==='relieve') doRel();
  else if(k==='strip') doStr();
  else if(k==='stitch'){ doSti(); return; }
  else if(k==='change'){ doChg(); return; }
  else if(k==='rest') doRst();
  endT();
}

  if(ev==='scrap'){ var n=rnd(1,3); S.scrap+=n; lg('📦 +'+n+' лоскутов.','ok'); fnd(); return; }
  if(ev==='berry'){ S.food++; aHp(5); lg('🍇 +1 еда, +5 HP.','ok'); fnd(); return; }

  else if(k==='skeleton'){ p='Скелет.'; ef=scSkel; }
  else if(k==='goblin'){ p='Гоблин.'; ef=scGoblin; }
  else if(k==='bugs_worms'){ p='Черви.'; ef=function(){ scBgs(true); }; }
  else if(k==='bugs_spiders'){ p='Пауки.'; ef=function(){ scBgs(false); }; }
  else if(k==='relieve'){ p='Лона уединяется.'; ef=function(){ aAr(-55); S.muddy=1; moan('heavy','relieve'); }; }
  else if(k==='ecstasy'){ p='Экстаз.'; ef=function(){ aAr(-60); S.muddy=1; S.ecstasyCount++; moan('max','ecstasy'); }; }
  else if(k==='strip'){ p='Срывает одежду.'; ef=doStr; }
  else if(k==='muddy'){ p='Грязь.'; ef=function(){ S.muddy=1; aAr(10); }; }
  else if(k==='cold'){ p='Холод.'; ef=function(){ S.weather='Холод'; aAr(5); }; }
  else if(k==='hot'){ p='Жара.'; ef=function(){ S.weather='Жара'; aAr(15); }; }
  else if(k==='rain'){ p='Дождь.'; ef=function(){ S.weather='Дождь'; aAr(10); S.muddy=1; }; }
  else if(k==='stitch'){ p='Штопка.'; ef=function(){ S.scrap=Math.max(0,S.scrap-1); }; }
  else if(k==='change'){ p='Переодевается.'; }
  else if(k==='find_chest'){ p='Сундук.'; ef=function(){ S.gold+=rnd(5,20); fnd(); }; }
  else if(k==='find_berry'){ p='Ягоды.'; ef=function(){ S.food++; }; }
  else if(k==='stranger'){ p='Незнакомец.'; ef=function(){ aAr(15); }; }
  else if(k==='ghost'){ p='Призрак.'; ef=function(){ aAr(20); }; }
  else if(k==='witch'){ p='Ведьма.'; ef=function(){ S.potions++; }; }
  else if(k==='altar'){ p='Алтарь.'; ef=function(){ aAr(15); }; }
  else if(k==='merchant'){ p='Торговец.'; ef=null; }
  else if(k==='wound'){ p='Раненый.'; ef=function(){ aAr(10); }; }
  else{ p=ct; }
  if(ef) ef();
  S.lastScene=p;
  lg('📖 '+p,'hn'); lg('⏳ ИИ...','ai');
  return askAI(p,'game').then(function(r){
    clLg(); lg('🎬 СЦЕНА','sc-btn'); lg(s(r)); render();
  });
}

function rCht(d){
  clLg(); lg('🛠 Чит-меню','ch-btn');
  var cs=[
    ['❤️ +50 HP',function(){aHp(50);}],['❤️ Полное HP',function(){S.hp=S.maxHp;}],
    ['⚡ +50 ст',function(){aSt(50);}],['💗 +20 возб',function(){aAr(20);}],
    ['💗 +50 возб',function(){aAr(50);}],['💗 Обнулить',function(){S.ar=0;}],
    ['🎒 +10 лоск',function(){S.scrap+=10;}],['🌿 +5 трав',function(){S.herbs+=5;}],
    ['🧪 +3 зелья',function(){S.potions+=3;}],['🍖 +5 еды',function(){S.food+=5;}],
    ['💰 +100 зол',function(){S.gold+=100;}],
    ['👕 Порвать одежду',function(){ for(var k in S.ward) S.ward[k].dur=Math.max(0,S.ward[k].dur-1); rip('heavy'); }],
    ['🔴 Уничтожить',function(){ for(var k in S.ward) S.ward[k].dur=0; rip('max'); }],
    ['✅ Починить',function(){ for(var k in S.ward) S.ward[k].dur=3; }],
    ['🌿 Грязь',function(){S.muddy=1;}],['✨ Очистить',function(){S.muddy=0;}],
    ['🌤 Погода',function(){S.weather=pk(['Нормальная','Холод','Жара','Дождь']);}],
    ['🕐 Время',function(){S.time=pk(['день','вечер','ночь']);}],
    ['🎬 Ход',function(){S.turn++;}],['⚔️ +1 убийство',function(){S.kills++;}],
    ['💗 ТЕСТ: стон лёг',function(){moan('light','sensitive');}],
    ['💗 ТЕСТ: стон сил',function(){moan('heavy','relieve');}],
    ['💗 ТЕСТ: стон макс',function(){moan('max','ecstasy');}],
    ['🩹 ТЕСТ: разрыв',function(){rip('heavy');}],
    ['💥 ТЕСТ: удар',function(){hit();}],
    ['❌ ТЕСТ: провал',function(){fai();}],
    ['✨ ТЕСТ: находка',function(){fnd();}]
  ];
  cs.forEach(function(o){
    var b=document.createElement('button'); b.className='ch-btn'; b.textContent=o[0];
    b.onclick=function(){ o[1](); render(); rCht($('bt')); };
    d.appendChild(b);
  });
  d.appendChild(mkBtn('⬅️','Назад','',function(){ S.mode='ai'; clLg(); render(); }));
}

//  НАСТРОЙКИ

function openSet(){ S.mode='settings'; clLg(); render(); }
function mkRow(lbl,build){
  var r=document.createElement('div'); r.className='sr';
  var l=document.createElement('div'); l.className='lbl'; l.textContent=lbl;
  var rt=document.createElement('div'); rt.style.display='flex'; rt.style.alignItems='center'; rt.style.gap='6px';
  build(rt);
  r.appendChild(l); r.appendChild(rt);
  return r;
}
function mkSl(lbl,val,mn,mx,st,onCh){
  var r=document.createElement('div'); r.className='sr';
  var l=document.createElement('div'); l.className='lbl'; l.textContent=lbl;
  var w=document.createElement('div'); w.style.display='flex'; w.style.alignItems='center'; w.style.gap='6px';
  var vs=document.createElement('span'); vs.className='vl'; vs.textContent=Math.round(val*100)+'%';
  var inp=document.createElement('input'); inp.type='range'; inp.min=mn; inp.max=mx; inp.step=st; inp.value=val;
  inp.oninput=function(){ var ret=onCh(parseFloat(inp.value)); if(ret) vs.textContent=ret; };
  w.appendChild(vs); w.appendChild(inp);
  r.appendChild(l); r.appendChild(w);
  return r;
}
function mkTg(on,fn){
  var t=document.createElement('div'); t.className='tg'+(on?' on':''); t.onclick=fn; return t;
}
function rSet(d){
  clLg(); lg('⚙️ НАСТРОЙКИ','ai'); lg('Сохраняется автоматически.','hn');

  lg('🎨 ТЕМА','ai');
  var th={rose:'🌹',night:'🌙',dawn:'🌅',witch:'🔮'};
  var tr=document.createElement('div'); tr.className='th-row';
  Object.keys(th).forEach(function(k){
    var b=document.createElement('button');
    if(CFG.theme===k) b.classList.add('on');
    b.innerHTML=th[k]+'<span class="tn">'+k+'</span>';
    b.onclick=function(){ CFG.theme=k; applyCfg(); rSet(d); };
    tr.appendChild(b);
  });
  d.appendChild(tr);

  lg('🔊 ЗВУК','ai');
  d.appendChild(mkRow('Звук',function(c){
    c.appendChild(mkTg(snd,function(){ togSnd(); setTimeout(function(){ rSet(d); },100); }));
  }));
  d.appendChild(mkSl('Общая громкость',CFG.masterVol,0,1,0.05,function(v){
    CFG.masterVol=v; sCfg();
    if(snd && ac) beep(800,.08,.06);
    return Math.round(v*100)+'%';
  }));

  lg('🎵 РЕГУЛЯТОРЫ','ai');
  var sfx=[['💗 Стоны','volMoan',function(){moanSnd('light');}],['🩹 Разрывы','volRip',function(){rip('heavy');}],['💥 Удары','volHit',function(){hit();}],['✨ Находки','volFind',function(){fnd();}],['❌ Провалы','volFail',function(){fai();}]];
  sfx.forEach(function(item){
    d.appendChild(mkSl(item[0],CFG[item[1]],0,2,0.1,function(v){
      CFG[item[1]]=v; sCfg();
      if(snd) item[2]();
      return Math.round(v*100)+'%';
    }));
  });

  lg('🎨 ИНТЕРФЕЙС','ai');
  d.appendChild(mkRow('Шрифт',function(c){
    var s=document.createElement('div'); s.className='sg';
    [12,14,16,18].forEach(function(sz){
      var b=document.createElement('button'); b.textContent=sz;
      if(CFG.fontSize===sz) b.classList.add('on');
      b.onclick=function(){ CFG.fontSize=sz; applyCfg(); rSet(d); };
      s.appendChild(b);
    });
    c.appendChild(s);
  }));

  var rs=document.createElement('button'); rs.className='dg-btn';
  rs.innerHTML='<span class="ic">🗑</span>Сбросить всё';
  rs.onclick=function(){
    if(confirm('Сбросить настройки и ключ?')){
      try{ localStorage.removeItem('lc15'); localStorage.removeItem('lk15'); }catch(e){}
      location.reload();
    }
  };
  d.appendChild(rs);
  d.appendChild(mkBtn('⬅️','Вернуться в игру','',function(){ S.mode='game'; clLg(); render(); }));
}

function showInp(ph,cb){
  $('ia').innerHTML='';
  var inp=document.createElement('textarea'); inp.placeholder=ph;
  $('ia').appendChild(inp);
  var b1=document.createElement('button');
  b1.innerHTML='<span class="ic">✅</span>Отправить';
  b1.onclick=function(){ $('ia').innerHTML=''; cb(inp.value.trim()); };
  $('ia').appendChild(b1);
  var b2=document.createElement('button');
  b2.innerHTML='<span class="ic">✖</span>Отмена';
  b2.onclick=function(){ $('ia').innerHTML=''; render(); };
  $('ia').appendChild(b2);
  inp.focus();
}
