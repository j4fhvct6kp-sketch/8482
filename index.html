<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Lona RPG</title>
<style>
:root{--bg:#13080d;--bg2:#1a0a12;--panel:rgba(36,20,25,.85);--border:#3d2230;--text:#f0e6ea;--dim:#a88b96;--accent:#e56b9b;--accent2:#8b3a62;--ok:#5ad67d;--bad:#e56b6b;--warn:#ffd76a;--cyan:#8ec8e5}
body[data-theme="night"]{--bg:#0a0f1a;--bg2:#0d1424;--panel:rgba(20,28,46,.85);--border:#2a3d5c;--text:#dce8f5;--dim:#7a8ba8;--accent:#6ba8e5;--accent2:#3a5a8b}
body[data-theme="dawn"]{--bg:#faf0e8;--bg2:#f5e5d8;--panel:rgba(255,255,255,.85);--border:#e0c8b8;--text:#3a2820;--dim:#8a7060;--accent:#d4647a;--accent2:#a04058;--ok:#3a9a5a;--bad:#c04040}
body[data-theme="witch"]{--bg:#0f0a1a;--bg2:#150a20;--panel:rgba(30,20,46,.85);--border:#4a2d6a;--text:#e8d8f5;--dim:#9a82b8;--accent:#a86be5;--accent2:#5a3a8b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:radial-gradient(circle at 50% 0%,var(--bg2),var(--bg) 70%);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;padding:10px;min-height:100vh;transition:background .8s;overflow-x:hidden;font-size:14px}
body[data-ar="high"]{background:radial-gradient(circle at 50% 0%,color-mix(in srgb,var(--accent2) 30%,var(--bg2)),var(--bg) 70%)}
body[data-ar="max"]{background:radial-gradient(circle at 50% 0%,color-mix(in srgb,var(--accent) 35%,var(--bg2)),var(--bg) 70%);animation:breathe 2.5s ease-in-out infinite}
@keyframes breathe{0%,100%{filter:brightness(1)}50%{filter:brightness(1.13)}}
body[data-moan="on"]{animation:bodyPulse 1.2s ease-out}
@keyframes bodyPulse{0%{filter:brightness(1)}25%{filter:brightness(1.25) saturate(1.2)}100%{filter:brightness(1)}}
#bg-particles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.particle{position:absolute;border-radius:50%;background:var(--accent);opacity:.15;animation:float linear infinite}
@keyframes float{0%{transform:translateY(100vh);opacity:0}10%{opacity:.2}90%{opacity:.2}100%{transform:translateY(-10vh);opacity:0}}
.wrap{max-width:560px;margin:0 auto;position:relative;z-index:1}
.audio-banner{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;padding:9px 14px;border-radius:10px;text-align:center;font-size:.85rem;margin-bottom:8px;cursor:pointer;animation:pulseBan 1.5s infinite;box-shadow:0 4px 20px color-mix(in srgb,var(--accent) 50%,transparent)}
@keyframes pulseBan{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.audio-banner.hide{display:none}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
h1{color:var(--accent);font-size:.95rem;letter-spacing:.22em;margin:0;font-weight:600;text-align:center;flex:1;text-shadow:0 0 12px color-mix(in srgb,var(--accent) 40%,transparent)}
.icon-btn{background:transparent;border:1px solid var(--border);color:var(--text);width:38px;height:38px;border-radius:10px;font-size:1.1rem;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;margin:0;text-align:center}
.icon-btn:active{background:var(--border)}
.icon-btn.on{border-color:var(--accent);box-shadow:0 0 12px color-mix(in srgb,var(--accent) 50%,transparent)}
.avatar{position:relative;width:100%;height:140px;background:linear-gradient(180deg,color-mix(in srgb,var(--accent2) 30%,var(--bg2)),var(--bg));border:1px solid var(--border);border-radius:16px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;overflow:hidden;box-shadow:inset 0 0 40px color-mix(in srgb,var(--accent) 12%,transparent)}
.avatar .face{font-size:72px;line-height:1;transition:transform .5s,filter .5s;filter:drop-shadow(0 0 20px color-mix(in srgb,var(--accent) 40%,transparent))}
body[data-ar="high"] .avatar .face{transform:scale(1.08)}
body[data-ar="max"] .avatar .face{animation:pulse .9s ease-in-out infinite;filter:drop-shadow(0 0 30px var(--accent))}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.avatar .mood{position:absolute;bottom:6px;right:10px;font-size:.75rem;color:var(--dim);background:rgba(0,0,0,.35);padding:3px 9px;border-radius:10px}
.avatar .weather-ico{position:absolute;top:8px;right:10px;font-size:1.2rem}
.avatar .loc-ico{position:absolute;top:8px;left:10px;font-size:.8rem;color:var(--dim);background:rgba(0,0,0,.35);padding:3px 9px;border-radius:10px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px;margin:6px 0;font-size:.83rem;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.row{display:flex;justify-content:space-between;padding:2px 0;gap:8px;align-items:center}
.row span:first-child{flex-shrink:0;opacity:.9}
.row b{font-weight:500;text-align:right}
.bar{height:8px;background:rgba(0,0,0,.4);border-radius:5px;overflow:hidden;margin:4px 0}
.bar>div{height:100%;transition:width .5s cubic-bezier(.4,0,.2,1)}
.hp>div{background:linear-gradient(90deg,#6a1010,#e56b6b);box-shadow:0 0 8px #e56b6b80}
.st>div{background:linear-gradient(90deg,#205080,#6b9ee5);box-shadow:0 0 8px #6b9ee580}
.ar>div{background:linear-gradient(90deg,var(--accent2),var(--accent));box-shadow:0 0 10px var(--accent)}
.log{min-height:130px;max-height:36vh;overflow-y:auto;line-height:1.55;scroll-behavior:smooth}
.log::-webkit-scrollbar{width:4px}
.log::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.log p{margin:0 0 6px;animation:slideIn .35s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.ok{color:var(--ok)}.bad{color:var(--bad)}.crit{color:var(--warn);font-weight:600}
.hint{color:var(--dim);font-style:italic}
.ai{color:#c98aff}.lona{color:var(--accent)}.me{color:var(--cyan)}
.code{color:#7ac8ff;font-family:monospace;font-size:.82rem;white-space:pre-wrap}
.loc{color:var(--accent2)}
button{width:100%;padding:12px;margin:4px 0;font:inherit;font-size:.88rem;color:var(--text);background:rgba(51,32,42,.6);border:1px solid var(--border);border-radius:10px;text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
button:active{background:var(--accent2);transform:scale(.98);color:#fff}
button .ico{font-size:1.05rem;flex-shrink:0}
button.ai-btn{background:linear-gradient(180deg,rgba(61,31,74,.7),rgba(42,22,32,.7));border-color:#8b3a62}
button.cheat-btn{background:linear-gradient(180deg,rgba(58,42,16,.7),rgba(36,20,25,.7));border-color:#8a6a30}
button.scene-btn{background:linear-gradient(180deg,rgba(16,58,42,.7),rgba(36,20,25,.7));border-color:#308a6a}
button.lona-btn{background:linear-gradient(180deg,rgba(74,31,48,.7),rgba(42,22,32,.7));border-color:#a83a62}
button.key-btn{background:linear-gradient(180deg,rgba(31,58,74,.7),rgba(36,20,25,.7));border-color:#3a6a8a}
button.danger-btn{background:linear-gradient(180deg,rgba(58,16,16,.7),rgba(36,20,25,.7));border-color:#8a3030}
button.gold-btn{background:linear-gradient(180deg,rgba(74,58,16,.7),rgba(36,20,25,.7));border-color:#c9a87c}
.dim{color:var(--dim)}.small{font-size:.72rem}
textarea{width:100%;padding:10px;background:rgba(0,0,0,.3);color:var(--text);border:1px solid var(--border);border-radius:8px;font:inherit;font-size:.9rem;margin:5px 0;min-height:70px;resize:vertical}
textarea:focus{outline:none;border-color:var(--accent)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--accent2);color:#fff;padding:10px 18px;border-radius:22px;font-size:.85rem;opacity:0;transition:.3s;pointer-events:none;z-index:100;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.moan-overlay{position:fixed;top:22%;left:50%;transform:translate(-50%,-50%) scale(.5);font-size:2.6rem;font-weight:700;color:var(--accent);text-shadow:0 0 30px var(--accent),0 0 60px var(--accent),0 0 90px var(--accent);opacity:0;pointer-events:none;z-index:200;text-align:center;line-height:1.1;letter-spacing:.05em}
.moan-overlay.show{animation:moanPop 1.6s ease-out forwards}
.moan-overlay .sub{font-size:.85rem;color:var(--text);opacity:.75;display:block;margin-top:10px;font-weight:400;letter-spacing:.12em;text-shadow:none}
@keyframes moanPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-8deg)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.35) rotate(4deg)}45%{opacity:1;transform:translate(-50%,-50%) scale(1.05) rotate(-2deg)}75%{opacity:.9;transform:translate(-50%,-55%) scale(1)}100%{opacity:0;transform:translate(-50%,-170%) scale(.9)}}
.theme-switcher{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.theme-switcher button{margin:0;padding:10px;text-align:center;justify-content:center;font-size:1.2rem}
.theme-switcher button.active{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 20%,transparent)}
</style></head><body data-theme="rose" data-ar="low">
<div id="bg-particles"></div>
<div class="wrap">
  <div class="audio-banner" id="audioBanner">👆 Тапни здесь чтобы включить звук</div>
  <div class="topbar">
    <button class="icon-btn" onclick="openThemes()">🎨</button>
    <h1>LONA RPG</h1>
    <button class="icon-btn" onclick="toggleSound()" id="soundBtn">🔇</button>
  </div>
  <div class="avatar">
    <div class="loc-ico" id="locIco">🌲 Тёмный лес</div>
    <div class="weather-ico" id="weatherIco">🌤</div>
    <div class="face" id="face">🙂</div>
    <div class="mood" id="mood">Спокойна</div>
  </div>
  <div class="card" id="stats"></div>
  <div class="card" id="ward"></div>
  <div class="card log" id="log"></div>
  <div id="inputArea"></div>
  <div id="btns"></div>
</div>
<div class="toast" id="toast"></div>
<div class="moan-overlay" id="moanOverlay"></div>

<script>
// ══════════════════════════════════════════════════════════════
//  🔊 АУДИО-ДВИЖОК (реалистичный синтез)
// ══════════════════════════════════════════════════════════════
let soundOn = false;
let audioCtx = null;
let audioUnlocked = false;
let NOISE_BUF = null;  // общий буфер белого шума

function createAudioCtx(){
  if(audioCtx) return audioCtx;
  try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ audioCtx = null; }
  return audioCtx;
}

function getNoiseBuffer(){
  if(NOISE_BUF) return NOISE_BUF;
  const ctx = createAudioCtx();
  if(!ctx) return null;
  const len = ctx.sampleRate * 2;
  NOISE_BUF = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = NOISE_BUF.getChannelData(0);
  for(let i=0; i<len; i++) d[i] = Math.random()*2 - 1;
  return NOISE_BUF;
}

async function unlockAudio(){
  const ctx = createAudioCtx();
  if(!ctx) return false;
  try{
    if(ctx.state === 'suspended') await ctx.resume();
    const buf = ctx.createBuffer(1, 1, 22050);
    const src = ctx.createBufferSource();
    src.buffer = buf; src.connect(ctx.destination); src.start(0);
    getNoiseBuffer();
    audioUnlocked = (ctx.state === 'running');
    return audioUnlocked;
  }catch(e){ return false; }
}

function bindUnlock(){
  const handler = async ()=>{
    const ok = await unlockAudio();
    if(ok){
      document.getElementById('audioBanner').classList.add('hide');
      document.removeEventListener('touchstart', handler);
      document.removeEventListener('click', handler);
    }
  };
  document.addEventListener('touchstart', handler);
  document.addEventListener('click', handler);
}
bindUnlock();

document.getElementById('audioBanner').addEventListener('touchstart', async e=>{
  e.stopPropagation();
  await unlockAudio();
  soundOn = true;
  document.getElementById('soundBtn').textContent = '🔊';
  document.getElementById('soundBtn').classList.add('on');
  document.getElementById('audioBanner').classList.add('hide');
  toast('Звук включён');
  playTestSound();
});

async function toggleSound(){
  if(!soundOn){
    const ok = await unlockAudio();
    if(!ok){ toast('Не удалось включить звук'); return; }
    soundOn = true;
    document.getElementById('soundBtn').textContent = '🔊';
    document.getElementById('soundBtn').classList.add('on');
    document.getElementById('audioBanner').classList.add('hide');
    toast('Звук включён');
    playTestSound();
  } else {
    soundOn = false;
    document.getElementById('soundBtn').textContent = '🔇';
    document.getElementById('soundBtn').classList.remove('on');
    toast('Звук выключен');
  }
}

function playTestSound(){
  beep(660, 0.1, 0.08);
  setTimeout(()=>beep(880, 0.14, 0.08), 120);
}

// ══════════════════════════════════════════════════════════════
//  БАЗОВЫЕ ХЕЛПЕРЫ
// ══════════════════════════════════════════════════════════════
function beep(freq, dur, vol, type){
  if(!soundOn || !audioCtx || audioCtx.state !== 'running') return;
  try{
    const now = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.frequency.value = freq;
    o.type = type || 'sine';
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(vol || 0.05, now + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(now); o.stop(now + dur + 0.02);
  }catch(e){}
}

// ══════════════════════════════════════════════════════════════
//  💥 УДАР — реалистичный "thump" с резонансом
// ══════════════════════════════════════════════════════════════
function sfxHit(){
  if(!soundOn || !audioCtx || audioCtx.state !== 'running') return;
  try{
    const ctx = audioCtx;
    const now = ctx.currentTime;
    const noise = getNoiseBuffer();
    if(!noise) return;

    // 1. Низкий удар — синус с быстрым падением частоты
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(140, now);
    o.frequency.exponentialRampToValueAtTime(40, now + 0.15);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(0.22, now + 0.005);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
    o.connect(g); g.connect(ctx.destination);
    o.start(now); o.stop(now + 0.32);

    // 2. Телесный щелчок — фильтрованный шум
    const src = ctx.createBufferSource();
    src.buffer = noise;
    src.playbackRate.value = 1.3;
    const filt = ctx.createBiquadFilter();
    filt.type = 'bandpass';
    filt.frequency.value = 900;
    filt.Q.value = 1.2;
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(0.0001, now);
    ng.gain.linearRampToValueAtTime(0.15, now + 0.003);
    ng.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
    src.connect(filt); filt.connect(ng); ng.connect(ctx.destination);
    src.start(now); src.stop(now + 0.15);

    // 3. Хвост — низкий «резонанс» как от удара по дереву
    const tail = ctx.createOscillator();
    const tg = ctx.createGain();
    tail.type = 'triangle';
    tail.frequency.value = 80;
    tg.gain.setValueAtTime(0.08, now + 0.02);
    tg.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
    tail.connect(tg); tg.connect(ctx.destination);
    tail.start(now + 0.02); tail.stop(now + 0.42);
  }catch(e){}
}

// ══════════════════════════════════════════════════════════════
//  🩹 РАЗРЫВ ТКАНИ — реалистичный рваный шум
// ══════════════════════════════════════════════════════════════
function sfxRip(intensity){
  if(!soundOn || !audioCtx || audioCtx.state !== 'running') return;
  try{
    const ctx = audioCtx;
    const noise = getNoiseBuffer();
    if(!noise) return;

    const now = ctx.currentTime;

    // Параметры по интенсивности
    const conf = {
      light: { bursts: 4, dur: 0.06, hpf: 2200, gain: 0.10, rate: 1.4, spacing: 0.028 },
      heavy: { bursts: 7, dur: 0.08, hpf: 1800, gain: 0.15, rate: 1.2, spacing: 0.03 },
      max:   { bursts: 11, dur: 0.10, hpf: 1400, gain: 0.19, rate: 1.0, spacing: 0.032 }
    }[intensity] || { bursts: 4, dur: 0.07, hpf: 2000, gain: 0.12, rate: 1.3, spacing: 0.03 };

    // Основная «рвущаяся» полоса
    for(let i=0; i<conf.bursts; i++){
      const t = now + i * conf.spacing;
      const src = ctx.createBufferSource();
      src.buffer = noise;
      src.playbackRate.value = conf.rate + Math.random()*0.5;

      // Полосовой фильтр с рандомной центральной частотой — каждый "рывок" звучит по-своему
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = conf.hpf + Math.random()*1500;
      bp.Q.value = 1.8 + Math.random()*1.5;

      const hp = ctx.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.value = conf.hpf * 0.5;

      const g = ctx.createGain();
      const gDur = conf.dur * (0.8 + Math.random()*0.5);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(conf.gain * (0.6 + Math.random()*0.5), t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + gDur);

      src.connect(hp); hp.connect(bp); bp.connect(g); g.connect(ctx.destination);
      src.start(t, Math.random()*1.5, gDur + 0.02);
    }

    // Дополнительный «дребезг» — очень высокие частоты на длинных разрывах
    if(intensity !== 'light'){
      const t2 = now + 0.02;
      const crackle = ctx.createBufferSource();
      crackle.buffer = noise;
      crackle.playbackRate.value = 2.2;
      const cf = ctx.createBiquadFilter();
      cf.type = 'highpass'; cf.frequency.value = 4000;
      const cg = ctx.createGain();
      cg.gain.setValueAtTime(0.0001, t2);
      cg.gain.linearRampToValueAtTime(0.06, t2 + 0.01);
      cg.gain.exponentialRampToValueAtTime(0.0001, t2 + 0.25);
      crackle.connect(cf); cf.connect(cg); cg.connect(ctx.destination);
      crackle.start(t2); crackle.stop(t2 + 0.28);
    }
  }catch(e){}
}

// ══════════════════════════════════════════════════════════════
//  ✨ НАХОДКА — приятный арпеджио-аккорд
// ══════════════════════════════════════════════════════════════
function sfxFind(){
  if(!soundOn || !audioCtx || audioCtx.state !== 'running') return;
  try{
    const ctx = audioCtx;
    const now = ctx.currentTime;
    // Соль-мажорное арпеджио: G5, B5, D6, G6
    const notes = [784, 988, 1175, 1568];
    notes.forEach(function(freq, i){
      const t = now + i * 0.06;
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'triangle';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.07, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + 0.4);
    });
  }catch(e){}
}

// ══════════════════════════════════════════════════════════════
//  ❌ ПРОВАЛ — глухой низкий удар
// ══════════════════════════════════════════════════════════════
function sfxFail(){
  if(!soundOn || !audioCtx || audioCtx.state !== 'running') return;
  try{
    const ctx = audioCtx;
    const now = ctx.currentTime;
    // Двойной низкий сигнал, нисходящий
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(220, now);
    o.frequency.exponentialRampToValueAtTime(120, now + 0.25);
    o.frequency.exponentialRampToValueAtTime(70, now + 0.5);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(0.14, now + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
    o.connect(g); g.connect(ctx.destination);
    o.start(now); o.stop(now + 0.6);
  }catch(e){}
}

// ══════════════════════════════════════════════════════════════
//  💗 СТОН — формантный синтез человеческого голоса
// ══════════════════════════════════════════════════════════════
function sfxMoan(level){
  if(!soundOn || !audioCtx || audioCtx.state !== 'running') return;
  try{
    const ctx = audioCtx;
    const now = ctx.currentTime;

    // Параметры по уровню — частота женского голоса (F0 ~ 180-280 Гц)
    const conf = {
      light: { f0: 200, dur: 0.85, gain: 0.11, vibRate: 5.5, vibAmt: 6, formants: [[730,1.0],[1090,0.7],[2440,0.3]] },
      heavy: { f0: 230, dur: 1.25, gain: 0.14, vibRate: 6.0, vibAmt: 8, formants: [[680,1.0],[1150,0.75],[2700,0.35]] },
      max:   { f0: 270, dur: 1.6,  gain: 0.17, vibRate: 6.8, vibAmt: 11, formants: [[620,1.0],[1200,0.85],[2900,0.4]] }
    }[level] || { f0: 220, dur: 1.0, gain: 0.13, vibRate: 6, vibAmt: 7, formants: [[700,1.0],[1100,0.7],[2500,0.3]] };

    // 1. Источник — пила, богатая гармониками (нужна для формант)
    const osc = ctx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(conf.f0 * 0.9, now);
    // Дыхательный подъём: тон немного растёт к концу
    osc.frequency.exponentialRampToValueAtTime(conf.f0 * 1.15, now + conf.dur * 0.85);

    // 2. Вибрато — естественное дрожание
    const vib = ctx.createOscillator();
    const vibG = ctx.createGain();
    vib.frequency.value = conf.vibRate;
    vibG.gain.value = conf.vibAmt;
    vib.connect(vibG); vibG.connect(osc.frequency);

    // 3. Огибающая громкости — как дыхание
    const master = ctx.createGain();
    master.gain.setValueAtTime(0.0001, now);
    master.gain.linearRampToValueAtTime(conf.gain, now + 0.15);   // атака
    master.gain.setValueAtTime(conf.gain, now + conf.dur * 0.5);  // держим
    master.gain.exponentialRampToValueAtTime(0.0001, now + conf.dur);  // спад

    // 4. ФОРМАНТЫ — три резонанса = звук "Ааа"
    conf.formants.forEach(function(f){
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = f[0];
      bp.Q.value = 12;
      const fg = ctx.createGain();
      fg.gain.value = f[1];
      osc.connect(bp); bp.connect(fg); fg.connect(master);
    });

    // 5. Прямой сигнал — «телесность»
    const direct = ctx.createGain();
    direct.gain.value = 0.10;
    osc.connect(direct); direct.connect(master);

    master.connect(ctx.destination);

    // 6. Дыхание — вдох перед стоном (фильтрованный шум)
    const noise = getNoiseBuffer();
    if(noise){
      const breath = ctx.createBufferSource();
      breath.buffer = noise;
      breath.playbackRate.value = 1.2;
      const bf = ctx.createBiquadFilter();
      bf.type = 'bandpass'; bf.frequency.value = 1500; bf.Q.value = 1.5;
      const bg = ctx.createGain();
      bg.gain.setValueAtTime(0.0001, now);
      bg.gain.linearRampToValueAtTime(conf.gain * 0.5, now + 0.08);
      bg.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
      breath.connect(bf); bf.connect(bg); bg.connect(ctx.destination);
      breath.start(now); breath.stop(now + 0.4);
    }

    osc.start(now); vib.start(now);
    osc.stop(now + conf.dur + 0.2);
    vib.stop(now + conf.dur + 0.2);
  }catch(e){}
}

const MODELS = [
  'google/gemma-3-27b-it:free','meta-llama/llama-3.3-70b-instruct:free',
  'qwen/qwen3-next-80b-a3b-instruct:free','openai/gpt-oss-120b:free',
  'mistralai/mistral-small-3.1-24b-instruct:free','google/gemma-3-12b-it:free',
  'meta-llama/llama-3.2-3b-instruct:free','qwen/qwen3-4b:free'
];
let CUR = null;
const FAILS = {};
async function callModel(model, messages){
  const r = await fetch('https://openrouter.ai/api/v1/chat/completions',{
    method:'POST',
    headers:{'Authorization':'Bearer '+KEY,'Content-Type':'application/json','HTTP-Referer':'https://lona.local','X-Title':'Lona RPG'},
    body:JSON.stringify({model, messages})
  });
  if(r.status===200){ const d=await r.json(); return {ok:true, text:d.choices[0].message.content.trim()}; }
  const t = await r.text().catch(()=>'');
  return {ok:false, status:r.status, err:t.slice(0,100)};
}
async function aiCall(messages){
  const order = [];
  if(CUR) order.push(CUR);
  for(const m of MODELS) if(m!==CUR) order.push(m);
  let lastErr = '';
  for(const model of order){
    FAILS[model] = FAILS[model] || 0;
    if(FAILS[model] >= 3 && model !== CUR) continue;
    const res = await callModel(model, messages);
    if(res.ok){ CUR = model; FAILS[model]=0; return res.text; }
    if([401,403,404,402].includes(res.status)) FAILS[model]=99;
    else FAILS[model]++;
    lastErr = model.slice(0,25)+': '+res.status;
  }
  return '[ИИ недоступен. '+lastErr+']';
}

  if(ev==='berry'){ S.food+=1; addHp(5); log('🍇 Ягоды! +1 еда, +5 HP.','ok'); sfxFind(); return; }
  if(ev==='flower'){ S.herbs+=1; log('🌼 Редкий цветок. +1 трава.','ok'); sfxFind(); return; }
  if(ev==='mushroom'){ if(chance(0.6)){ S.herbs+=1; log('🍄 Съедобный гриб. +1 трава.','ok'); sfxFind(); } else { addHp(-6); log('🍄 Ядовитый гриб! -6 HP.','bad'); sfxFail(); } return; }
  if(ev==='chest'){ const g=rnd(3,20); S.gold+=g; log('💰 Сундук! +'+g+' золота.','crit'); sfxFind(); return; }
  if(ev==='stranger'){
    log('👤 Из тени появляется незнакомец...','hint');
    if(chance(0.5)){ S.gold+=rnd(1,5); log('Он молча бросает монету и уходит.','ok'); sfxFind(); }
    else { addAr(20); log('Он хватает Лону за руку — но она вырывается!','bad'); moan('light','sensitive'); }
    S.lastScene='Таинственный незнакомец встретился Лоне.'; return;
  }
  if(ev==='ghost'){ addAr(15); log('👻 Полупрозрачный силуэт проносится мимо...','bad'); sfxFail(); S.lastScene='Призрак появился перед Лоной.'; return; }
  if(ev==='trap'){ const dmg=rnd(5,15); addHp(-dmg); log('⚠️ Ловушка! -'+dmg+' HP.','bad'); sfxHit(); return; }
  if(ev==='sink'){ S.muddy=1; addSt(-10); log('🌿 Провалилась в трясину!','bad'); sfxFail(); return; }
  if(ev==='fog'){ log('🌫 Густой туман...','hint'); S.lastScene='Лона идёт сквозь туман.'; return; }
  if(ev==='wisp'){ addAr(10); S.herbs+=1; log('✨ Блуждающий огонёк и трава.','ok'); sfxFind(); return; }
  if(ev==='rest'){ addSt(15); log('🌼 Отдохнула на траве. +15 ст.','ok'); return; }
  if(ev==='butterfly'){ addAr(5); log('🦋 Бабочка на плече.','ok'); return; }
  if(ev==='swim'){ if(chance(0.7)){ S.muddy=0; addSt(-5); log('🌊 Искупалась. Грязь смыта.','ok'); } else { addHp(-8); log('🌊 Течение утащило. -8 HP.','bad'); sfxFail(); } return; }
  if(ev==='fish'){ S.food+=1; log('🐟 Поймала рыбу. +1 еда.','ok'); sfxFind(); return; }
}

function sceneBeast(){
  const beasts=[['🐺','Голодный волк',10,1],['🐗','Разъярённый кабан',15,2],['🐍','Гигантская змея',12,1],['🦊','Хитрый лис',6,1],['🐻','Дикий медведь',20,3]];
  const b=pick(beasts); const icon=b[0], name=b[1], dmg=b[3];
  log(icon+' '+name+' вылетает из кустов!','bad');
  sfxHit();
  const d=d10(); log('🎲 Реакция: '+d);
  const o=out(d);
  if(o==='crit'){ S.scrap+=2; S.kills++; log('✨ КРИТ! Отбилась, +2 лоскута. Убито: '+S.kills+'.','crit'); addAr(8); sfxFind(); }
  else if(o==='ok'){ log('🟢 Увернулась.','ok'); addAr(8); }
  else if(o==='critfail'){
    const t=pick(worn());
    if(t){ t.dur=0; log('💥 КРИТПРОВАЛ! '+t.name+' уничтожена!','bad'); }
    addHp(-dmg*2); addAr(40); S.muddy=1;
    sfxRip('max'); setTimeout(()=>moan('max','torn'), 200);
  } else {
    const targets=worn().sort(()=>Math.random()-.5).slice(0,2);
    for(const t of targets){ t.dur=Math.max(0,t.dur-1); log('🔴 '+name+' рвёт '+t.name+'.','bad'); }
    addHp(-dmg); addAr(30); S.muddy=1;
    sfxRip('heavy'); setTimeout(()=>moan('heavy','beast'), 200);
  }
  S.lastScene=name+' напал на Лону.';
}

function sceneBugs(heavy){
  const bugs = heavy ? [['🪱','жирные черви'],['🕷️','ядовитые пауки'],['🐛','личинки']] : [['🐝','осы'],['🦟','комары'],['🕸️','паучки']];
  const b=pick(bugs); const icon=b[0], name=b[1];
  log(icon+' '+name+' выползают из гнили!','bad');
  const d=d10(); log('🎲 Бросок: '+d);
  const o=out(d);
  if(o==='crit'){ S.scrap+=2; log('✨ КРИТ! Нашла сундук с ветошью.','crit'); addAr(3); sfxFind(); }
  else if(o==='ok'){ log('🟢 Отбилась, твари отступили.','ok'); addAr(10); }
  else {
    const zone=chance(.5)?'pussy':'butt';
    const tag=zone==='pussy'?'[киска]':'[попка]';
    const shields=worn().filter(i=>i.covers.includes(zone)&&i.tight&&i.dur>1);
    if(shields.length){
      const sh=pick(shields); sh.dur--;
      if(chance(0.3)){ log(s('⚠️ '+sh.name+' прогрызен — лезут прямо к '+tag+'!'),'bad'); addAr(45); sfxRip('light'); setTimeout(()=>moan('heavy','bugs'),300); }
      else { log(s('🟢 '+sh.name+' держит оборону.'),'ok'); addAr(15); moan('light','sensitive'); }
    } else { log(s('🔴 Ничто не защищает '+tag+' — твари по коже!'),'bad'); addAr(50); moan('max','bugs'); }
    if(heavy) addHp(-5);
    S.muddy=1;
  }
  S.lastScene=name+' напали на Лону.';
}

function doHunt(){

  addSt(-10); log('⚔️ Лона идёт по следу зверя...');
  const d=d10(); log('🎲 Охота: '+d);
  const o=out(d);
  if(o==='crit'){ S.kills++; S.food+=2; S.gold+=rnd(3,10); log('✨ КРИТ! +2 еды, +золото.','crit'); sfxFind(); }
  else if(o==='ok'){ S.kills++; S.food+=1; log('🟢 Удачная охота. +1 еда.','ok'); }
  else if(o==='fail'){ log('🟡 След потерян.','hint'); }

}

    S.hp=30; S.over=0; S.turn++; render(); return; }
  if(chance(0.3)) S.weather=pick(['Нормальная','Холод','Жара','Дождь']);

  addSt(3); S.turn++; render();
}

function renderAIPanel(div){

    else b.className='ai-btn';

    b.onclick=async function(){
      if(k==='back'){ S.mode='game'; clearLog(); render(); return; }
      if(k==='setkey'){ S.mode='key'; clearLog(); render(); return; }
      if(k==='ai_scene'){ await doAIScene(); return; }
      if(k==='ai_custom'){ showTextInput('Спроси ГМ-а...', async function(v){
        if(!v) return; clearLog(); log('⏳ ИИ думает...','ai');

      if(k==='ai_code'){ showTextInput('Что написать?', async function(v){

      if(k==='cheat'){ S.mode='cheat'; clearLog(); render(); return; }
    };
    div.appendChild(b);
  });
}

  else if(key==='relieve'){ prompt='Лона уединяется и сбрасывает возбуждение.'; effect=function(){addAr(-55);S.muddy=1;moan('heavy','relieve')}; }

  else if(key==='muddy'){ prompt='Лона падает в болотную грязь.'; effect=function(){S.muddy=1;addAr(10)}; }
  else if(key==='cold'){ prompt='Резко холодает. Соски проступают через ткань.'; effect=function(){S.weather='Холод';addAr(5)}; }
  else if(key==='hot'){ prompt='Жара. Одежда липнет к телу.'; effect=function(){S.weather='Жара';addAr(15)}; }
  else if(key==='rain'){ prompt='Дождь. Всё мокрое, одежда облепила тело.'; effect=function(){S.weather='Дождь';addAr(10);S.muddy=1}; }
  else if(key==='stitch'){ prompt='Лона заштопывает одежду.'; effect=function(){S.scrap=Math.max(0,S.scrap-1)}; }
  else if(key==='change'){ prompt='Лона переодевается.'; effect=null; }
  else if(key==='find_chest'){ prompt='Лона находит сундук.'; effect=function(){S.gold+=rnd(5,20)}; }
  else if(key==='find_berry'){ prompt='Лона собирает ягоды.'; effect=function(){S.food+=1}; }
  else if(key==='stranger'){ prompt='Незнакомец встречает Лону.'; effect=function(){addAr(15)}; }
  else if(key==='ghost'){ prompt='Призрак появляется перед Лоной.'; effect=function(){addAr(20)}; }
  else { prompt=customText; }
  if(effect) effect();
  S.lastScene=prompt;
  log('📖 '+prompt,'hint'); log('⏳ ИИ пишет сцену...','ai');
  const r=await askAI(prompt,'game');
  clearLog(); log('🎬 СЦЕНА','scene-btn'); log(s(r));
  log(''); log('─── Состояние обновлено ───','hint');
  render();
}

    ['🩹 ТЕСТ: разрыв сильный',function(){sfxRip('heavy')}],

    ['💥 ТЕСТ: удар',function(){sfxHit()}],
    ['❌ ТЕСТ: провал',function(){sfxFail()}],

  cheats.forEach(function(o){

function showTextInput(placeholder, callback){
  $('inputArea').innerHTML='';
  const inp=document.createElement('textarea'); inp.placeholder=placeholder; $('inputArea').appendChild(inp);
  const btn=document.createElement('button'); btn.innerHTML='<span class="ico">✅</span>Отправить';
  btn.onclick=function(){ $('inputArea').innerHTML=''; callback(inp.value.trim()); }; $('inputArea').appendChild(btn);
  const cancel=document.createElement('button'); cancel.innerHTML='<span class="ico">✖</span>Отмена';
  cancel.onclick=function(){ $('inputArea').innerHTML=''; render(); }; $('inputArea').appendChild(cancel);
  inp.focus();
}
