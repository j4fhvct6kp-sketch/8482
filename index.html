*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:radial-gradient(circle at 50% 0,var(--bg2),var(--bg) 70%);color:var(--tx);font-family:-apple-system,sans-serif;padding:10px;min-height:100vh;font-size:var(--fs);overflow-x:hidden}

.wrap{max-width:540px;margin:0 auto}

.cd{background:var(--pnl);border:1px solid var(--bd);border-radius:11px;padding:9px;margin:5px 0;font-size:.82rem}

.mo{position:fixed;top:22%;left:50%;transform:translate(-50%,-50%);font-size:2.4rem;font-weight:700;color:var(--ac);opacity:0;pointer-events:none;z-index:200;text-align:center}

@keyframes mop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}60%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-170%) scale(.9)}}

.tg.on{background:var(--ac)}

.th-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:5px 0}

<script>

  volMoan: 1, volSigh: 1, volRip: 1, volHit: 1, volFind: 1, volFail: 1

try {
  var saved = localStorage.getItem('lc14');
  if (saved) Object.assign(CFG, JSON.parse(saved));
} catch(e) {}
function sCfg() {
  try { localStorage.setItem('lc14', JSON.stringify(CFG)); } catch(e) {}
}
function applyCfg() {
  document.body.dataset.theme = CFG.theme;
  document.documentElement.style.setProperty('--fs', CFG.fontSize + 'px');
  sCfg();

var ac = null;

function getAC() {
  if (ac) return ac;
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); }
  catch(e) { ac = null; }
  return ac;
}

function unlock() {
  var c = getAC();
  if (!c) return Promise.resolve(false);
  var p = (c.state === 'suspended') ? c.resume() : Promise.resolve();
  return p.then(function() {
    try {
      var b = c.createBuffer(1, 1, 22050);
      var s = c.createBufferSource();
      s.buffer = b; s.connect(c.destination); s.start(0);
    } catch(e) {}
    return c.state === 'running';
  });
}

document.getElementById('ab').addEventListener('touchstart', function(e) {
  e.stopPropagation();
  unlock().then(function(ok) {
    if (!ok) return;
    snd = true;
    var b = document.getElementById('sb');
    b.textContent = '🔊';
    b.classList.add('on');
    document.getElementById('ab').classList.add('hide');
    toast('Звук включён');
    testSound();
  });
});

function togSnd() {
  var b = document.getElementById('sb');
  if (!snd) {
    unlock().then(function(ok) {
      if (!ok) return;
      snd = true;
      b.textContent = '🔊';
      b.classList.add('on');
      document.getElementById('ab').classList.add('hide');
      toast('Звук включён');
      testSound();
    });
  } else {
    snd = false;
    b.textContent = '🔇';
    b.classList.remove('on');
    toast('Звук выключен');
  }
}

function testSound() {
  beep(660, 0.1, 0.08);
  setTimeout(function() { beep(880, 0.14, 0.08); }, 120);
}

function beep(f, d, v) {
  if (!snd || !ac) return;
  if (ac.state !== 'running') return;
  try {
    var n = ac.currentTime;
    var o = ac.createOscillator();
    var g = ac.createGain();
    o.frequency.value = f;
    o.type = 'sine';
    g.gain.setValueAtTime(0.0001, n);
    g.gain.linearRampToValueAtTime(v * CFG.masterVol, n + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, n + d);
    o.connect(g); g.connect(ac.destination);
    o.start(n); o.stop(n + d + 0.02);
  } catch(e) {}
}

// Простой стон (короткий)
function moanSnd(level) {
  if (!snd || !ac || ac.state !== 'running') return;
  var vol = CFG.masterVol * CFG.volMoan;
  if (vol <= 0) return;
  try {
    var c = ac;
    var n = c.currentTime;
    var f0 = (level === 'max') ? 430 : (level === 'heavy') ? 380 : 340;
    var f1 = (level === 'max') ? 560 : (level === 'heavy') ? 470 : 400;
    var dur = (level === 'max') ? 1.5 : (level === 'heavy') ? 1.1 : 0.7;
    var o = c.createOscillator();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(f0, n);
    o.frequency.linearRampToValueAtTime(f1, n + dur * 0.75);
    var m = c.createGain();
    m.gain.setValueAtTime(0.0001, n);
    m.gain.linearRampToValueAtTime(0.12 * vol, n + 0.12);
    m.gain.setValueAtTime(0.12 * vol, n + dur * 0.45);
    m.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    // 3 форманта
    [850, 1220, 2810].forEach(function(fq) {
      var bp = c.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = fq;
      bp.Q.value = 12;
      o.connect(bp); bp.connect(m);
    });
    m.connect(c.destination);
    o.start(n); o.stop(n + dur + 0.2);
  } catch(e) {}
}

// Разрыв ткани
function rip(level) {
  if (!snd || !ac || ac.state !== 'running') return;
  var vol = CFG.masterVol * CFG.volRip;
  if (vol <= 0) return;
  try {
    var c = ac;
    var n = c.currentTime;
    var count = (level === 'max') ? 8 : (level === 'heavy') ? 5 : 3;
    for (var i = 0; i < count; i++) {
      var t = n + i * 0.04;
      var buf = c.createBuffer(1, 2048, c.sampleRate);
      var d = buf.getChannelData(0);
      for (var j = 0; j < 2048; j++) d[j] = (Math.random() * 2 - 1) * (1 - j / 2048);
      var s = c.createBufferSource();
      s.buffer = buf;
      var hp = c.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.value = 1200;
      var g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.1 * vol, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
      s.connect(hp); hp.connect(g); g.connect(c.destination);
      s.start(t); s.stop(t + 0.12);
    }
  } catch(e) {}
}

// Удар
function hit() {
  if (!snd || !ac || ac.state !== 'running') return;
  var vol = CFG.masterVol * CFG.volHit;
  if (vol <= 0) return;
  try {
    var c = ac;
    var n = c.currentTime;
    var o = c.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(140, n);
    o.frequency.exponentialRampToValueAtTime(40, n + 0.15);
    var g = c.createGain();
    g.gain.setValueAtTime(0.0001, n);
    g.gain.linearRampToValueAtTime(0.22 * vol, n + 0.005);
    g.gain.exponentialRampToValueAtTime(0.001, n + 0.28);
    o.connect(g); g.connect(c.destination);
    o.start(n); o.stop(n + 0.32);
  } catch(e) {}
}

// Находка
function fnd() {
  if (!snd || !ac || ac.state !== 'running') return;
  var vol = CFG.masterVol * CFG.volFind;
  if (vol <= 0) return;
  var c = ac;
  var n = c.currentTime;
  [784, 988, 1175, 1568].forEach(function(f, i) {
    var t = n + i * 0.06;
    var o = c.createOscillator();
    o.type = 'triangle';
    o.frequency.value = f;
    var g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.07 * vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + 0.4);
  });
}

// Провал
function fai() {
  if (!snd || !ac || ac.state !== 'running') return;
  var vol = CFG.masterVol * CFG.volFail;
  if (vol <= 0) return;
  try {
    var c = ac;
    var n = c.currentTime;
    var o = c.createOscillator();
    o.type = 'triangle';
    o.frequency.setValueAtTime(220, n);
    o.frequency.exponentialRampToValueAtTime(70, n + 0.5);
    var g = c.createGain();
    g.gain.setValueAtTime(0.0001, n);
    g.gain.linearRampToValueAtTime(0.14 * vol, n + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, n + 0.55);
    o.connect(g); g.connect(c.destination);
    o.start(n); o.stop(n + 0.6);
  } catch(e) {}
}

function cl(v, a, b) { return Math.max(a, Math.min(b, v)); }
function rnd(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
function ch(p) { return Math.random() < p; }
function pk(a) { return a[Math.floor(Math.random() * a.length)]; }
function d10() { return Math.floor(Math.random() * 10) + 1; }

function out(v) {
  if (v <= 3) return 'cf';
  if (v <= 5) return 'f';

}

var S = {
  hp: 100, maxHp: 100,
  st: 100, maxSt: 100,
  ar: 0,
  scrap: 2, herbs: 0, potions: 1, food: 2, gold: 0,
  loc: 'forest', weather: 'Нормальная', time: 'день',
  muddy: 0,
  set: 'Обычный', ward: {},
  turn: 1, kills: 0, ecstasyCount: 0,
  pending: 0, over: 0,
  lastScene: '', mode: 'game',
  chat: []
};

function bW(n) {
  var w = {};
  for (var k in SETS[n]) {
    var v = SETS[n][k];
    w[k] = { name: v[0], tight: v[1], covers: v[2], dur: 3 };
  }
  return w;
}
S.ward = bW(S.set);

function aAr(n) { S.ar = cl(S.ar + n, 0, 100); }
function aHp(n) { S.hp = cl(S.hp + n, 0, S.maxHp); }
function aSt(n) { S.st = cl(S.st + n, 0, S.maxSt); }
function wrn() {
  var r = [];
  for (var k in S.ward) if (S.ward[k].dur > 0) r.push(S.ward[k]);
  return r;
}

// ══════════════════════════════════════════
//  ИИ
// ══════════════════════════════════════════
var KEY = '';
try { KEY = localStorage.getItem('lk14') || ''; } catch(e) {}

function saveK(k) {
  KEY = k.trim();
  try { localStorage.setItem('lk14', KEY); } catch(e) {}
}

var MODELS = [
  'google/gemma-3-27b-it:free',
  'meta-llama/llama-3.3-70b-instruct:free',
  'qwen/qwen3-next-80b-a3b-instruct:free',
  'openai/gpt-oss-120b:free',
  'mistralai/mistral-small-3.1-24b-instruct:free'
];
var CUR = null;
var FL = {};

function callModel(m, msgs) {
  return fetch('https://openrouter.ai/api/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + KEY,
      'Content-Type': 'application/json',
      'HTTP-Referer': 'https://lona.local',
      'X-Title': 'Lona'
    },
    body: JSON.stringify({ model: m, messages: msgs })
  }).then(function(r) {
    if (r.status === 200) {
      return r.json().then(function(d) {
        return { ok: true, text: d.choices[0].message.content.trim() };
      });
    }
    return { ok: false, status: r.status };
  });
}

function aiCall(msgs) {
  var order = [];
  if (CUR) order.push(CUR);
  for (var i = 0; i < MODELS.length; i++) {
    if (MODELS[i] !== CUR) order.push(MODELS[i]);
  }
  var lastErr = '';
  var idx = 0;

  function tryNext() {
    if (idx >= order.length) return Promise.resolve('[ИИ недоступен. ' + lastErr + ']');
    var m = order[idx++];
    FL[m] = FL[m] || 0;
    if (FL[m] >= 3 && m !== CUR) return tryNext();
    return callModel(m, msgs).then(function(r) {
      if (r.ok) { CUR = m; FL[m] = 0; return r.text; }
      if (r.status === 401 || r.status === 402 || r.status === 403 || r.status === 404) FL[m] = 99;
      else FL[m]++;
      lastErr = m.slice(0, 20) + ':' + r.status;
      return tryNext();
    });
  }
  return tryNext();
}

function stateTxt() {
  var w = [];
  var slots = ['outer','top','bra','bottom','panties','swim_top','swim_bottom'];
  for (var i = 0; i < slots.length; i++) {
    var sl = slots[i];
    var it = S.ward[sl];
    if (!it) continue;
    w.push(SL[sl] + '=' + it.name + '(' + ['рвань','порвано','надорвано','целая'][it.dur] + ')');
  }
  return 'HP ' + S.hp + '/' + S.maxHp +
    ', ст ' + S.st + '/' + S.maxSt +
    ', возб ' + S.ar + '%' +
    ', лок ' + LOC[S.loc].n +
    ', погода ' + S.weather +
    ', ' + S.time +
    ', ' + (S.muddy ? 'грязь' : 'чисто') +
    ', лоск ' + S.scrap + ' трав ' + S.herbs + ' зел ' + S.potions + ' еды ' + S.food + ' зол ' + S.gold +
    ', ' + (w.join(', ') || 'без одежды') +
    ', ход ' + S.turn;
}

function askAI(msg, mode, useState) {
  if (!KEY) return Promise.resolve('[Ключ не введён.]');
  if (useState === undefined) useState = true;
  if (!mode) mode = 'game';
  var sys;
  if (mode === 'code') {
    sys = 'Ты опытный программист. Пиши рабочий код с комментариями.';
  } else if (mode === 'lona') {
    sys = 'Ты — Лона, 19-летняя застенчивая девушка. Отвечай ОТ ПЕРВОГО ЛИЦА, смущённо, живо, коротко (1-3 предложения).';
  } else {
    sys = 'Ты — Гейм-Мастер тёмного фэнтези RPG. Пиши атмосферно, коротко (2-4 предложения).';
  }
  var msgs = [{ role: 'system', content: sys }];
  if (useState) msgs.push({ role: 'system', content: stateTxt() });
  if (mode === 'lona' && S.chat.length) {
    var tail = S.chat.slice(-8);
    for (var i = 0; i < tail.length; i++) msgs.push(tail[i]);
  }
  msgs.push({ role: 'user', content: msg });
  return aiCall(msgs);
}

// ══════════════════════════════════════════
//  РЕНДЕР
// ══════════════════════════════════════════
function face() {
  if (S.ar >= 100) return '💗';
  if (S.ar >= 75) return '🥵';
  if (S.ar >= 50) return '😳';
  if (S.ar >= 25) return '😊';
  if (S.hp <= 30) return '🤕';
  if (S.muddy) return '🫠';
  return '🙂';
}
function moodTxt() {
  if (S.ar >= 100) return 'На грани';
  if (S.ar >= 75) return 'Тяжело дышит';
  if (S.ar >= 50) return 'Смущена';
  if (S.ar >= 25) return 'Застенчива';
  if (S.hp <= 30) return 'Ранена';
  if (S.muddy) return 'Грязная';
  return 'Спокойна';
}
function wIco() {
  if (S.weather === 'Холод') return '❄️';
  if (S.weather === 'Жара') return '🔥';
  if (S.weather === 'Дождь') return '🌧';
  return '🌤';
}

function render() {
  if (S.ar >= 90) document.body.dataset.ar = 'max';
  else if (S.ar >= 50) document.body.dataset.ar = 'high';
  else document.body.dataset.ar = 'low';

  $('fc').textContent = face();
  $('md').textContent = moodTxt();
  $('li').textContent = LOC[S.loc].n;
  $('wi').textContent = wIco();

  var hpPct = S.hp / S.maxHp * 100;
  var stPct = S.st / S.maxSt * 100;

  var html = '';
  html += '<div class="rw"><span>🕐 ' + S.time + '</span><b>🌤 ' + S.weather + '</b></div>';
  html += '<div class="rw"><span>❤️ HP</span><b>' + S.hp + '/' + S.maxHp + '</b></div>';
  html += '<div class="br hp"><div style="width:' + hpPct + '%"></div></div>';
  html += '<div class="rw"><span>⚡ Выносливость</span><b>' + S.st + '/' + S.maxSt + '</b></div>';
  html += '<div class="br st"><div style="width:' + stPct + '%"></div></div>';
  html += '<div class="rw"><span>💗 Возбуждение</span><b>' + S.ar + '%</b></div>';
  html += '<div class="br ar"><div style="width:' + S.ar + '%"></div></div>';
  html += '<div class="rw sm dm"><span>🌿 ' + (S.muddy ? 'грязь' : 'чисто') + ' · 🎬 ' + S.turn + ' · ⚔️ ' + S.kills + '</span>';
  html += '<span>🔑' + (KEY ? '✅' : '❌') + ' 🔊' + (snd ? 'вкл' : 'выкл') + '</span></div>';
  $('stats').innerHTML = html;

  var w = '<div class="dm">👗 ' + S.set + '</div>';
  var slots = ['outer','top','bra','bottom','panties','swim_top','swim_bottom'];
  for (var i = 0; i < slots.length; i++) {
    var sl = slots[i];
    var it = S.ward[sl];
    if (!it) continue;
    w += '<div class="rw"><span>' + SL[sl] + '</span><b>' + it.name + ' ' + DUR[it.dur] + '</b></div>';
  }
  w += '<div class="rw sm dm"><span>🎒 ' + S.scrap + ' · 🌿 ' + S.herbs + ' · 🧪 ' + S.potions + ' · 🍖 ' + S.food + ' · 💰 ' + S.gold + '</span></div>';
  $('wrd').innerHTML = w;

  $('ia').innerHTML = '';
  rBtns();
}

// ══════════════════════════════════════════
//  КНОПКИ
// ══════════════════════════════════════════
function mkBtn(icon, label, cls, fn) {
  var b = document.createElement('button');
  if (cls) b.className = cls;
  b.innerHTML = '<span class="ic">' + icon + '</span>' + label;
  b.onclick = fn;
  return b;
}

function rBtns() {
  var d = $('bt');
  d.innerHTML = '';

  if (S.mode === 'ai') { rAI(d); return; }
  if (S.mode === 'cheat') { rCht(d); return; }
  if (S.mode === 'scenes') { rScn(d); return; }
  if (S.mode === 'chat') { rChat(d); return; }
  if (S.mode === 'key') { rKey(d); return; }
  if (S.mode === 'travel') { rTrav(d); return; }
  if (S.mode === 'inv') { rInv(d); return; }
  if (S.mode === 'settings') { rSet(d); return; }

  if (S.over) {
    d.appendChild(mkBtn('🔄', 'Начать заново', 'dg-btn', function() { location.reload(); }));
    return;
  }

  d.appendChild(mkBtn('🔍', 'Осмотреться', 'sc-btn', function() { act('explore'); }));
  d.appendChild(mkBtn('🧭', 'Идти в другую локацию', 'gl-btn', function() { act('travel'); }));
  if (S.st >= 10) d.appendChild(mkBtn('⚔️', 'Охотиться', 'sc-btn', function() { act('hunt'); }));
  if (S.ar >= 25) d.appendChild(mkBtn('🥵', 'Уединиться', '', function() { act('relieve'); }));
  if (wrn().length) d.appendChild(mkBtn('👕', 'Сорвать верх', '', function() { act('strip'); }));
  if (Object.keys(S.ward).some(function(k) { return S.ward[k].dur > 0 && S.ward[k].dur < 3; }) && S.scrap >= 2) {
    d.appendChild(mkBtn('🛠️', 'Заштопать', '', function() { act('stitch'); }));
  }
  d.appendChild(mkBtn('👗', 'Переодеться', '', function() { act('change'); }));
  d.appendChild(mkBtn('💤', 'Отдохнуть', '', function() { act('rest'); }));
  d.appendChild(mkBtn('🎒', 'Инвентарь', '', function() { act('inv'); }));
  d.appendChild(mkBtn('🤖', 'ИИ-панель', 'ai-btn', function() { act('ai'); }));
}

// ══════════════════════════════════════════
//  ИГРОВЫЕ ДЕЙСТВИЯ
// ══════════════════════════════════════════
function act(k) {
  if (S.over) return;
  clLg();

  if (S.pending) {
    scEc();
    S.pending = 0;
    S.turn++;
    endT();
    return;
  }

  if (k === 'ai') { S.mode = 'ai'; clLg(); render(); return; }
  if (k === 'travel') { S.mode = 'travel'; clLg(); render(); return; }
  if (k === 'inv') { S.mode = 'inv'; clLg(); render(); return; }

  if (k === 'explore') doExp();
  else if (k === 'hunt') doHunt();
  else if (k === 'relieve') doRel();
  else if (k === 'strip') doStr();
  else if (k === 'stitch') { doSti(); return; }
  else if (k === 'change') { doChg(); return; }
  else if (k === 'rest') doRst();

  endT();
}

function doExp() {
  var l = LOC[S.loc];
  var ev = pk(l.ev);
  lg('🔍 Лона осматривается в ' + l.n + '...');
  lg(l.d, 'hn');
  if (!S.lastScene) S.lastScene = 'Лона исследует ' + l.n + '.';
  lg('🎲 Внимание: ' + d10(), 'hn');

  if (ev === 'beast') { scBst(); return; }
  if (ev === 'bugs') { scBgs(false); return; }
  if (ev === 'bugs2') { scBgs(true); return; }

  if (ev === 'scrap') {
    var n = rnd(1, 3);
    S.scrap += n;
    lg('📦 +' + n + ' лоскутов.', 'ok');
    fnd(); return;
  }
  if (ev === 'berry') { S.food++; aHp(5); lg('🍇 +1 еда, +5 HP.', 'ok'); fnd(); return; }
  if (ev === 'flower') { S.herbs++; lg('🌼 +1 трава.', 'ok'); fnd(); return; }
  if (ev === 'mushroom') {
    if (ch(0.6)) { S.herbs++; lg('🍄 Съедобный.', 'ok'); fnd(); }
    else { aHp(-6); lg('🍄 Ядовитый! -6 HP.', 'bad'); fai(); }
    return;
  }
  if (ev === 'chest') {
    var g = rnd(3, 20);
    S.gold += g;
    lg('💰 +' + g + ' золота.', 'cr');
    fnd(); return;
  }
  if (ev === 'stranger') {
    lg('👤 Незнакомец...', 'hn');
    if (ch(0.5)) { S.gold += rnd(1, 5); lg('Бросает монету.', 'ok'); fnd(); }
    else { aAr(20); lg('Хватает Лону — она вырывается!', 'bad'); moan('light', 'sensitive'); }
    S.lastScene = 'Незнакомец.';
    return;
  }
  if (ev === 'ghstost') { aAr(15); lg('👻 Призрак!', 'bad'); fai(); return; }
  if (ev === 'trap') {
    var dm = rnd(5, 15);
    aHp(-dm);
    lg('⚠️ Ловушка! -' + dm + ' HP.', 'bad');
    hit(); return;
  }
  if (ev === 'sink') { S.muddy = 1; aSt(-10); lg('🌿 Трясина!', 'bad'); fai(); return; }
  if (ev === 'fog') { lg('🌫 Туман...', 'hn'); return; }
  if (ev === 'wisp') { aAr(10); S.herbs++; lg('✨ Огонёк и трава.', 'ok'); fnd(); return; }
  if (ev === 'rest') { aSt(15); lg('🌼 +15 ст.', 'ok'); return; }
  if (ev === 'butterfly') { aAr(5); lg('🦋 Бабочка.', 'ok'); return; }
  if (ev === 'swim') {
    if (ch(0.7)) { S.muddy = 0; aSt(-5); lg('🌊 Грязь смыта.', 'ok'); }
    else { aHp(-8); lg('🌊 -8 HP.', 'bad'); fai(); }
    return;
  }
  if (ev === 'fish') { S.food++; lg('🐟 +1 еда.', 'ok'); fnd(); return; }
}

function scB() {
  var beasts = [
    ['🐺','Волк',1], ['🐗','Кабан',2], ['🐍','Змея',1],
    ['🦊','Лис',1], ['🐻','Медведь',3]
  ];
  var b = pk(beasts);
  lg(b[0] + ' ' + b[1] + ' вылетает!', 'bad');
  hit();
  var o = out(d10());
  lg('🎲 ' + o);

  if (o === 'cr') {
    S.scrap += 2; S.kills++;
    lg('✨ КРИТ! +2 лоскута.', 'cr');
    aAr(8); fnd();
  } else if (o === 'ok') {
    lg('🟢 Увернулась.', 'ok');
    aAr(8);
  } else if (o === 'cf') {
    var t = pk(wrn());
    if (t) { t.dur = 0; lg('💥 КРИТПРОВАЛ! ' + t.name + ' уничтожена!', 'bad'); }
    aHp(-b[2] * 2);
    aAr(40);
    S.muddy = 1;
    rip('max');
    setTimeout(function() { moan('max', 'torn'); }, 200);
  } else {
    var ts = wrn().sort(function() { return Math.random() - 0.5; }).slice(0, 2);
    for (var i = 0; i < ts.length; i++) {
      ts[i].dur = Math.max(0, ts[i].dur - 1);
      lg('🔴 ' + b[1] + ' рвёт ' + ts[i].name + '.', 'bad');
    }
    aHp(-b[2]);
    aAr(30);
    S.muddy = 1;
    rip('heavy');
    setTimeout(function() { moan('heavy', 'beast'); }, 200);
  }
  S.lastScene = b[1] + ' напал.';
}

function scBgs(hv) {
  var bugs;
  if (hv) bugs = [['🪱','черви'],['🕷️','пауки'],['🐛','личинки']];
  else bugs = [['🐝','осы'],['🦟','комары'],['🕸️','паучки']];
  var b = pk(bugs);
  lg(b[0] + ' ' + b[1] + ' выползают!', 'bad');
  var o = out(d10());
  lg('🎲 ' + o);

  if (o === 'cr') { S.scrap += 2; lg('✨ КРИТ!', 'cr'); aAr(3); fnd(); }
  else if (o === 'ok') { lg('🟢 Отбилась.', 'ok'); aAr(10); }
  else {
    var zone = ch(0.5) ? 'pussy' : 'butt';
    var tg = zone === 'pussy' ? '[киска]' : '[попка]';
    var shields = wrn().filter(function(i) {
      return i.covers.indexOf(zone) !== -1 && i.tight && i.dur > 1;
    });
    if (shields.length) {
      var s1 = pk(shields);
      s1.dur--;
      if (ch(0.3)) {
        lg(s('⚠️ ' + s1.name + ' прогрызен — к ' + tg + '!'), 'bad');
        aAr(45); rip('light');
        setTimeout(function() { moan('heavy', 'bugs'); }, 300);
      } else {
        lg(s('🟢 ' + s1.name + ' держит.'), 'ok');
        aAr(15); moan('light', 'sensitive');
      }
    } else {
      lg(s('🔴 Ничто не защищает ' + tg + '!'), 'bad');
      aAr(50); moan('max', 'bugs');
    }
    if (hv) aHp(-5);
    S.muddy = 1;
  }
  S.lastScene = b[1] + ' напали.';
}

function doHunt() {
  if (S.st < 10) { lg('Устала.', 'hn'); return; }
  aSt(-10);
  lg('⚔️ Охота...');
  var o = out(d10());
  lg('🎲 ' + o);
  if (o === 'cr') { S.kills++; S.food += 2; S.gold += rnd(3, 10); lg('✨ КРИТ!', 'cr'); fnd(); }
  else if (o === 'ok') { S.kills++; S.food++; lg('🟢 +1 еда.', 'ok'); }
  else if (o === 'f') { lg('🟡 След потерян.', 'hn'); }
  else { aHp(-8); lg('💥 -8 HP.', 'bad'); hit(); }
}

function doRel() {
  lg(s('🥵 Лона уединяется. Рука под [лифчик]...'));
  lg(s('Пальцы к [киска]...'));
  aAr(-55); S.muddy = 1; aSt(5);
  lg('💨 ' + S.ar + '%', 'ok');
  moan('heavy', 'relieve');
  S.lastScene = 'Лона уединилась.';
}

function doStr() {
  var inn = { bra: 1, panties: 1, swim_top: 1, swim_bottom: 1 };
  var items = wrn().filter(function(i) {
    var slot = null;
    for (var k in S.ward) if (S.ward[k] === i) slot = k;
    return !inn[slot];
  });
  if (!items.length) { lg('Срывать нечего.', 'hn'); return; }
  for (var i = 0; i < items.length; i++) {
    items[i].dur = 0;
    lg('👕 Срывает ' + items[i].name + '.');
  }
  aAr(20);
  rip('heavy');
  setTimeout(function() { moan('light', 'strip'); }, 250);
  S.lastScene = 'Лона сорвала верх.';
}

function doSti() {
  clLg();
  lg('🛠️ Что заштопать?');
  var d = $('bt'); d.innerHTML = '';
  var items = [];
  for (var k in S.ward) if (S.ward[k].dur > 0 && S.ward[k].dur < 3) items.push(S.ward[k]);
  items.forEach(function(i) {
    var b = document.createElement('button');
    b.innerHTML = '<span class="ic">🧵</span>' + i.name + ' — ' + DUR[i.dur];
    b.onclick = function() {
      i.dur = Math.min(3, i.dur + 1);
      S.scrap -= 2;
      clLg();
      lg('✅ ' + i.name + ' заштопана.', 'ok');
      fnd(); endT();
    };
    d.appendChild(b);
  });
  var c = document.createElement('button');
  c.textContent = 'Отмена';
  c.onclick = function() { clLg(); render(); };
  d.appendChild(c);
}

function doChg() {
  clLg();
  lg('👗 Какой сет?');
  var d = $('bt'); d.innerHTML = '';
  Object.keys(SETS).forEach(function(n) {
    var b = document.createElement('button');
    b.innerHTML = '<span class="ic">👗</span>' + n + (n === S.set ? ' (сейчас)' : '');
    b.onclick = function() {
      S.set = n;
      S.ward = bW(n);
      aAr(5);
      clLg();
      lg('👗 ' + n + '.', 'ok');
      endT();
    };
    d.appendChild(b);
  });
  var c = document.createElement('button');
  c.textContent = 'Отмена';
  c.onclick = function() { clLg(); render(); };
  d.appendChild(c);
}

function doRst() {
  if (S.st >= S.maxSt) { lg('Уже отдохнула.', 'hn'); return; }
  aSt(30); aHp(5);
  lg('💤 +30 ст, +5 HP.', 'ok');
  if (ch(0.3)) {
    var d = pk(wrn());
    if (d) { d.dur = Math.max(0, d.dur - 1); lg('⚠️ Ветер порвал ' + d.name + '.', 'bad'); rip('light'); }
  }
}

function rTrav(d) {
  clLg();
  lg('🧭 ' + LOC[S.loc].n, 'lc');
  lg('Куда?', 'hn');
  LOC[S.loc].to.forEach(function(n) {
    var b = document.createElement('button');
    b.className = 'gl-btn';
    b.innerHTML = '<span class="ic">➡️</span>' + LOC[n].n;
    b.onclick = function() {
      S.loc = n; aSt(-5); aAr(3);
      if (ch(0.2)) S.weather = pk(['Нормальная','Холод','Жара','Дождь']);
      clLg();

function endT() {
  if (S.hp <= 0) {
    S.over = 1; clLg();

    lg('Очнулась у костра. HP восстановлено.', 'hn');
    fai();
    S.hp = 30; S.over = 0; S.turn++;
    render(); return;
  }
  if (ch(0.3)) S.weather = pk(['Нормальная','Холод','Жара','Дождь']);
  if (S.muddy && ch(0.3)) { S.muddy = 0; lg('🌿 Грязь оттёрта.', 'hn'); }
  if (ch(0.15)) S.time = S.time === 'день' ? 'вечер' : S.time === 'вечер' ? 'ночь' : 'день';
  if (S.time === 'ночь') aAr(5);

  if (S.ar >= 100) {
    lg('⚠️ 100%! Самоконтроль...', 'bad');
    var d = d10();
    lg('🎲 ' + d);
    if (d < 5) { S.pending = 1; S.ecstasyCount++; lg('🔴 СОРВАЛОСЬ!', 'bad'); }
    else { aAr(-15); lg('🟢 Удержалась.', 'ok'); }
  }
  aSt(3);
  S.turn++;
  render();
}

function rAI(d) {
  clLg();
  lg('🤖 ИИ-ПАНЕЛЬ', 'ai');
  lg('Ключ: ' + (KEY ? '✅' : '❌') + ' · ' + (CUR ? CUR.slice(0, 30) : 'модель не выбрана'), KEY ? 'ok' : 'bad');

  var opts = [
    ['ai_scene','📖','Дополнить сцену'],
    ['ai_custom','💬','Спросить ГМ-а'],
    ['chat','💗','Поговорить с Лоной'],
    ['scenes','🎬','Вызвать сцену'],
    ['ai_code','💻','Помочь с кодом'],
    ['cheat','🛠','Чит-меню'],
    ['setkey','🔑', (KEY ? 'Сменить' : 'Ввести') + ' ключ'],
    ['back','⬅️','В игру']
  ];
  opts.forEach(function(o) {
    var k = o[0], ico = o[1], l = o[2];
    var cls = '';
    if (k === 'chat') cls = 'lo-btn';
    else if (k === 'cheat') cls = 'ch-btn';
    else if (k === 'scenes') cls = 'sc-btn';
    else if (k === 'setkey') cls = 'ky-btn';
    else cls = 'ai-btn';

    d.appendChild(mkBtn(ico, l, cls, function() {
      if (k === 'back') { S.mode = 'game'; clLg(); render(); return; }
      if (k === 'setkey') { S.mode = 'key'; clLg(); render(); return; }
      if (k === 'chat') { S.mode = 'chat'; clLg(); render(); return; }
      if (k === 'scenes') { S.mode = 'scenes'; clLg(); render(); return; }
      if (k === 'cheat') { S.mode = 'cheat'; clLg(); render(); return; }
      if (k === 'ai_scene') {
        if (!S.lastScene) { clLg(); lg('Нет сцены.', 'hn'); rAI($('bt')); return; }
        clLg(); lg('⏳ ИИ пишет...', 'ai');
        askAI(S.lastScene + ' Допиши коротко.', 'game').then(function(r) {
          clLg(); lg('─── СЦЕНА ───', 'ai'); lg(s(r)); rAI($('bt'));
        });
        return;
      }
      if (k === 'ai_custom') {
        showInp('Спроси ГМ-а...', function(v) {
          if (!v) return;
          clLg(); lg('⏳ ИИ...', 'ai');
          askAI(v, 'game').then(function(r) {
            clLg(); lg('─── ИИ ───', 'ai'); lg(s(r)); rAI($('bt'));
          });
        });
        return;
      }
      if (k === 'ai_code') {
        showInp('Что написать?', function(v) {
          if (!v) return;
          clLg(); lg('⏳ ИИ...', 'ai');
          askAI(v, 'code', false).then(function(r) {
            clLg(); lg('─── КОД ───', 'cd2'); lg(r); rAI($('bt'));
          });
        });
        return;
      }
    }));
  });
}

  clLg();
  lg('🎬 Сцена', 'sc-btn');
  var p = '', ef = null;

  if (k === 'beast_wolf' || k === 'beast_boar') { p = 'Зверь нападает.'; ef = scBst; }

  else if (k === 'ecstasy') { p = 'Лона в экстазе.'; ef = function() { aAr(-60); S.muddy = 1; S.ecstasyCount++; moan('max','ecstasy'); }; }
  else if (k === 'strip') { p = 'Лона срывает одежду.'; ef = doStr; }
  else if (k === 'muddy') { p = 'Грязь.'; ef = function() { S.muddy = 1; aAr(10); }; }
  else if (k === 'cold') { p = 'Холодает.'; ef = function() { S.weather = 'Холод'; aAr(5); }; }
  else if (k === 'hot') { p = 'Жара.'; ef = function() { S.weather = 'Жара'; aAr(15); }; }
  else if (k === 'rain') { p = 'Дождь.'; ef = function() { S.weather = 'Дождь'; aAr(10); S.muddy = 1; }; }
  else if (k === 'stitch') { p = 'Штопка.'; ef = function() { S.scrap = Math.max(0, S.scrap - 1); }; }
  else if (k === 'change') { p = 'Переодевается.'; }
  else if (k === 'find_chest') { p = 'Сундук.'; ef = function() { S.gold += rnd(5, 20); fnd(); }; }
  else if (k === 'find_berry') { p = 'Ягоды.'; ef = function() { S.food++; }; }
  else if (k === 'stranger') { p = 'Незнакомец.'; ef = function() { aAr(15); }; }
  else if (k === 'ghost') { p = 'Призрак.'; ef = function() { aAr(20); }; }

  if (ef) ef();

  lg('📖 ' + p, 'hn');

function mkRow(lbl, build) {
  var r = document.createElement('div');
  r.className = 'sr';
  var l = document.createElement('div');
  l.className = 'lbl';
  l.textContent = lbl;
  var rt = document.createElement('div');
  rt.style.display = 'flex';
  rt.style.alignItems = 'center';
  rt.style.gap = '6px';
  build(rt);
  r.appendChild(l);
  r.appendChild(rt);
  return r;
}

function mkSl(lbl, val, mn, mx, st, onCh) {
  var r = document.createElement('div');
  r.className = 'sr';
  var l = document.createElement('div');
  l.className = 'lbl';
  l.textContent = lbl;
  var w = document.createElement('div');
  w.style.display = 'flex';
  w.style.alignItems = 'center';
  w.style.gap = '6px';
  var vs = document.createElement('span');
  vs.className = 'vl';
  vs.textContent = Math.round(val * 100) + '%';
  var inp = document.createElement('input');
  inp.type = 'range';
  inp.min = mn; inp.max = mx; inp.step = st; inp.value = val;
  inp.oninput = function() {
    var ret = onCh(parseFloat(inp.value));
    if (ret) vs.textContent = ret;
  };
  w.appendChild(vs);
  w.appendChild(inp);
  r.appendChild(l);
  r.appendChild(w);
  return r;
}

function mkToggle(on, fn) {
  var t = document.createElement('div');
  t.className = 'tg' + (on ? ' on' : '');
  t.onclick = fn;
  return t;
}
